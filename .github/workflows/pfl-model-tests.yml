name: PFL Model Tests
on:
  pull_request:
    paths:
      - 'pfl_analytics.js'
      - 'pfl_duration_model.js'
      - 'pfl_confidence.js'
      - 'tests/pfl_confidence.test.js'
      - 'tests/pfl_models.test.js'
      - '.github/workflows/pfl-model-tests.yml'
  push:
    paths:
      - 'pfl_analytics.js'
      - 'pfl_duration_model.js'
      - 'tests/pfl_models.test.js'
      - '.github/workflows/pfl-model-tests.yml'
jobs:
  pfl-model-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PFL model tests
        run: |
          node tests/pfl_models.test.js
          node tests/pfl_confidence.test.js
