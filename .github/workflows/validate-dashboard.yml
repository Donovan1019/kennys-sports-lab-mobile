name: Validate mobile dashboard
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python source
        run: python -m py_compile scripts/fetch_odds.py scripts/fetch_nfl_stats.py scripts/market_math.py scripts/fetch_nfl_props.py scripts/analytics_core.py scripts/fetch_nba_nhl_stats.py scripts/fetch_nhl_official_stats.py scripts/matchup_monte_carlo.py scripts/model_predictions.py scripts/connect_nfl_team_scores.py scripts/backtest_nfl.py scripts/connect_nba_nhl_scores.py
      - name: Validate JavaScript syntax
        run: |
          node --check all_sports.js
          node --check manual_odds_refresh.js
          node --check comparison_lab.js
          node --check simulation_lab.js
          node --check kennys_sgp.js
          node --check nfl_player_stats.js
          node --check nfl_prop_research.js
          node --check nfl_prop_odds.js
          node --check nfl_prop_model.js
          node --check feature_roadmap.js
          node --check nfl_trends_board.js
          node --check reference_research.js
          node --check nba_research.js
          node --check nhl_research.js
          node --check league_player_logs.js
          node --check player_profile.js
          node --check player_page_pro.js
          node --check mobile_navigation.js
          node --check home_top10.js
      - name: Run independent analytics tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate snapshot schema and links
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          html=Path("index.html").read_text()
          for js in ["all_sports.js","manual_odds_refresh.js","comparison_lab.js","simulation_lab.js","kennys_sgp.js","nfl_player_stats.js","nfl_prop_research.js","nfl_prop_odds.js","nfl_prop_model.js","feature_roadmap.js","nfl_trends_board.js","reference_research.js","nba_research.js","nhl_research.js","league_player_logs.js","player_profile.js","player_page_pro.js","mobile_navigation.js","home_top10.js"]:
              assert Path(js).is_file(), js
              assert 'src="'+js+'"' in html or 'src="'+js+'?' in html, js
          for path in Path("feed").glob("*.json"):
              data=json.loads(path.read_text())
              if path.name=="nfl_props.json":
                  assert data["source"]=="the-odds-api-v4-event-props"
                  assert isinstance(data["odds"],list)
              elif path.name in ("nba_player_stats.json","nhl_player_stats.json"):
                  assert data["source"]=="espn-public-boxscore"
                  assert isinstance(data["players"],list)
              elif path.name=="nhl_official_player_stats.json":
                  assert data["source"]=="nhl-official-boxscore"
                  assert isinstance(data["players"],list)
              elif path.name in ("nba_completed_games.json","nhl_completed_games.json"):
                  assert data["source"]=="espn-public-completed-league-games"
                  assert isinstance(data["games"],list)
              elif path.name in ("nba_backtest.json","nhl_backtest.json"):
                  assert data["source"]=="walk-forward-league-monte-carlo"
                  assert isinstance(data["results"],list)
              elif path.name in ("nba_independent_game_inputs.json","nhl_independent_game_inputs.json"):
                  assert data["source"]=="verified-independent-team-scoring"
                  assert isinstance(data["games"],list)
              elif path.name=="nfl_completed_games.json":
                  assert data["source"]=="espn-public-completed-nfl-games"
                  assert isinstance(data["games"],list)
              elif path.name=="nfl_backtest.json":
                  assert data["source"]=="walk-forward-nfl-monte-carlo"
                  assert isinstance(data["results"],list)
              elif path.name=="model_candidates.json":
                  assert data["schema_version"]==1
                  assert isinstance(data["predictions"],list)
              elif path.name=="model_predictions.json":
                  assert data["schema_version"]==1
                  assert isinstance(data["predictions"],list)
              elif path.name=="independent_game_inputs.json":
                  assert data["source"]=="verified-independent-team-scoring"
                  assert isinstance(data["games"],list)
              elif path.name=="nfl_player_stats.json":
                  assert data["source"]=="nflverse-stats-player-week"
                  assert isinstance(data["players"],list)
              else:
                  assert data["source"]=="the-odds-api-v4"
                  assert isinstance(data["odds"],list)
              if path.name not in ("model_predictions.json","model_candidates.json","independent_game_inputs.json","nba_independent_game_inputs.json","nhl_independent_game_inputs.json"):
                  assert data.get("fetched_at"), f"Missing fetched_at: {path.name}"
          print("Dashboard references and available snapshot schema: PASS")
          PY
