name: Backtest NBA and NHL scoring models
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: nba-nhl-backtest-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and run regression tests
        run: |
          python -m py_compile scripts/connect_nba_nhl_scores.py scripts/backtest_nfl.py scripts/sport_simulation.py scripts/market_backtest.py scripts/backtest_nba.py scripts/audit_odds_integrity.py scripts/betting_market_math.py
          python -m unittest discover -s tests -p "test_*.py"
      - name: Import completed NBA and NHL games and run 10000-trial backtests
        run: python -m scripts.connect_nba_nhl_scores
      - name: Validate NBA strict-prior-day probabilities on refreshed scores
        run: python scripts/backtest_nba.py
      - name: Audit market timestamps and exclude live or stale quotes
        run: python -m scripts.audit_odds_integrity
      - name: Validate historical margin and total errors
        run: python -m scripts.market_backtest
      - name: Verify history recovery and output integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for league in ('nba','nhl'):
              games=json.loads(Path(f'feed/{league}_completed_games.json').read_text())['games']
              assert len(games)>1000, f'{league}: too few games'
              ids=[(g['date'],g['home'],g['away']) for g in games]
              assert len(ids)==len(set(ids)),f'{league}: duplicate games'
              months={g['date'][:7] for g in games}
              assert '2025-11' in months and '2025-12' in months, f'{league}: 2025 historical gap remains'
              print(league, len(games), 'games; November and December present; unique game keys')
          PY
      - name: Commit backtest results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/basketball_nba_odds_integrity.json feed/icehockey_nhl_odds_integrity.json feed/nfl_market_validation.json feed/nba_market_validation.json feed/nhl_market_validation.json feed/nba_model_candidates.json feed/nhl_model_candidates.json feed/nba_completed_games.json feed/nhl_completed_games.json feed/nba_backtest.json feed/nhl_backtest.json feed/nba_independent_game_inputs.json feed/nhl_independent_game_inputs.json
          git diff --cached --quiet || (git commit -m "Publish independent NBA NHL score backtests" && git push)
