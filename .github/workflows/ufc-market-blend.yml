name: UFC Market Blend Holdout
on:
  pull_request:
  workflow_dispatch:
jobs:
  blend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_ufc_market_blend.py -v
      - run: python -m scripts.ufc_opponent_walkforward --output ufc_market_blend_holdout.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ufc-market-blend-holdout
          path: ufc_market_blend_holdout.json
