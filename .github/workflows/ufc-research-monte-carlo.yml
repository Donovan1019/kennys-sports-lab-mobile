name: Publish UFC Research Monte Carlo
on:
  push:
    branches: [main]
    paths:
      - 'feed/ufc_joined_stats.json'
      - 'scripts/ufc_research_monte_carlo.py'
      - '.github/workflows/ufc-research-monte-carlo.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ufc-research-monte-carlo
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test Monte Carlo
        run: python -m unittest discover -s tests -p test_ufc_research_monte_carlo.py -v
      - name: Generate 10k-trial research scenarios
        run: python scripts/ufc_research_monte_carlo.py
      - name: Publish research feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feed/ufc_research_monte_carlo.json
          git diff --cached --quiet || (git commit -m 'Publish UFC hypothetical Monte Carlo research scenarios' && git push)
