name: UFC Duration Math Validation
on:
  pull_request:
  workflow_dispatch:
jobs:
  duration-math:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ufc_fighter_projections.js
      - run: node tests/ufc_duration_survival.test.js
