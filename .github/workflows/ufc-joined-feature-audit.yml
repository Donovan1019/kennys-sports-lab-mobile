name: UFC Joined Historical Feature Audit
on:
  pull_request:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_ufc_joined_feature_audit.py -v
      - run: python -m scripts.ufc_joined_feature_audit --output ufc_joined_feature_audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: ufc-joined-feature-audit
          path: ufc_joined_feature_audit.json
