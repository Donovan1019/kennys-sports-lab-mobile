name: Refresh public odds snapshot
on:
  schedule:
    - cron: '10 11 * * *' # NCAAB
    - cron: '10 14 * * *' # NFL
    - cron: '10 17 * * *' # NHL
    - cron: '10 20 * * *' # NBA
  workflow_dispatch:
    inputs:
      sport:
        description: Sport
        required: true
        default: americanfootball_nfl
        type: choice
        options:
          - americanfootball_nfl
          - americanfootball_ncaaf
          - basketball_nba
          - basketball_ncaab
          - baseball_mlb
          - icehockey_nhl
          - mma_mixed_martial_arts
          - soccer_epl
      markets:
        description: Featured markets (availability and credits vary)
        required: true
        default: h2h
        type: choice
        options:
          - h2h
          - h2h,spreads,totals
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      ODDS_SPORT: ${{ inputs.sport || (github.event.schedule == '10 11 * * *' && 'basketball_ncaab') || (github.event.schedule == '10 14 * * *' && 'americanfootball_nfl') || (github.event.schedule == '10 17 * * *' && 'icehockey_nhl') || (github.event.schedule == '10 20 * * *' && 'basketball_nba') || 'americanfootball_nfl' }}
      ODDS_MARKETS: ${{ inputs.markets || 'h2h,spreads,totals' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch authorized sportsbook odds
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
        run: |
          if python scripts/fetch_odds.py; then
            echo 'Primary odds provider succeeded'
          elif [ "${ODDS_SPORT}" = 'americanfootball_nfl' ] && [ "${ODDS_MARKETS}" = 'h2h' ]; then
            echo 'Primary provider unavailable; trying OddsPapi NFL fallback'
            python scripts/fetch_nfl_oddspapi.py
          else
            echo 'Primary odds provider failed; no compatible fallback for this sport/market'
            exit 1
          fi
      - name: Rebuild NHL independent moneyline research feed
        if: ${{ env.ODDS_SPORT == 'icehockey_nhl' }}
        run: |
          python scripts/build_nhl_goal_rates.py
          python scripts/build_nhl_ml_predictions.py
      - name: Rebuild NBA moneyline model and research simulations
        if: ${{ env.ODDS_SPORT == 'basketball_nba' }}
        run: |
          python scripts/build_nba_ml_predictions.py
          python scripts/refresh_nba_ml_research_audit.py
      - name: Archive pre-kickoff NFL moneyline prices
        if: ${{ env.ODDS_SPORT == 'americanfootball_nfl' }}
        run: python scripts/archive_nfl_moneyline_snapshots.py odds
      - name: Verify NFL moneyline archive before publishing
        if: ${{ (inputs.sport || 'americanfootball_nfl') == 'americanfootball_nfl' }}
        run: python scripts/verify_nfl_archive_write.py odds
      - name: Publish snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/
          if [ -d archive/nfl_moneyline/odds ]; then git add archive/nfl_moneyline/odds/; fi
          if ! git diff --cached --quiet; then
            git commit -m "Update public odds snapshot"
            git push
          fi
