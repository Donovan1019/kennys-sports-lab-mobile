name: UFC Projection Coverage Audit
on:
  push:
    branches: [main]
    paths-ignore:
      - 'feed/ufc_unified_research.json'
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run fighter coverage and odds freshness audit
        run: python scripts/ufc_projection_coverage_audit.py | tee ufc_projection_coverage.json
      - name: Run unified five-stage UFC research pipeline
        run: |
          python scripts/ufc_projection_coverage_audit.py --pipeline-output ufc_unified_research.json
          python - <<'PY'
          import json
          from pathlib import Path
          card=json.loads(Path('feed/ufc_research.json').read_text())
          result=json.loads(Path('ufc_unified_research.json').read_text())
          expected={str(f['id']) for f in card['fights'] if f.get('red') and f.get('blue')}
          observed={f['fight_id'] for f in result['fights']}
          assert observed==expected, (expected-observed, observed-expected)
          assert result['bet_eligible'] is False
          assert result['coverage']['fights']==len(expected)
          assert result['coverage']['bet_eligible'] is False
          assert all(not v.get('duration_scenarios') or (not f['input_evidence']['scheduled_rounds_verified'] and set(v['duration_scenarios'])=={'3','5'} and all(x['status']=='HYPOTHETICAL_RESEARCH_ONLY' for x in v['duration_scenarios'].values())) for f in result['fights'] for v in f['count_simulation'].values())
          assert result['coverage']['model_ev_verified']==0
          assert result['coverage']['count_simulations_available']==sum(v['status']=='RESEARCH_ONLY' for f in result['fights'] for v in f['count_simulation'].values())
          assert all(not f['input_evidence']['odds_verified'] or f['betting']['status']=='NOT_ELIGIBLE' for f in result['fights'])
          assert all(not f['input_evidence']['scheduled_rounds_verified'] or all(v['status'] in ('RESEARCH_ONLY','UNAVAILABLE') for v in f['count_simulation'].values()) for f in result['fights'])
          assert all(f['calibration']['status'] in ('UNVERIFIED','HISTORICAL_CERTIFIED_NOT_LIVE') for f in result['fights'])
          assert all(f['betting']['status']=='NOT_ELIGIBLE' and f['betting']['model_ev'] is None for f in result['fights'])
          assert all(abs(f['sparse_data_probability']['red']+f['sparse_data_probability']['blue']-1)<.0002 for f in result['fights'])
          print('Full-card pipeline coverage:',len(observed),'research-only gates PASS')
          PY
      - name: Verify UFC scenario determinism and valid count bounds
        run: |
          python scripts/ufc_projection_coverage_audit.py --pipeline-output ufc_unified_research_repeat.json
          python - <<'PY'
          import json
          from pathlib import Path
          first=json.loads(Path('ufc_unified_research.json').read_text())
          repeat=json.loads(Path('ufc_unified_research_repeat.json').read_text())
          assert first==repeat, 'Research simulations are not reproducible'
          scenarios=0
          for fight in first['fights']:
              for fighter in fight['count_simulation'].values():
                  for rounds,scenario in fighter.get('duration_scenarios',{}).items():
                      scenarios+=1
                      assert rounds in ('3','5')
                      assert scenario['status']=='HYPOTHETICAL_RESEARCH_ONLY'
                      h=scenario['hazard_sensitivity']
                      assert h['low_finish_hazard']==0.08 and h['high_finish_hazard']==0.30
                      for key in ('sig_landed_mean_range','takedowns_landed_mean_range'):
                          assert len(h[key])==2 and all(isinstance(v,(int,float)) and v>=0 for v in h[key]) and h[key][0]<=h[key][1]
                      counts=scenario['count_means']
                      assert all(isinstance(v,(int,float)) and 0<=v<10000 for v in counts.values())
                      if 'sig_landed' in counts and 'sig_attempted' in counts:
                          assert counts['sig_landed']<=counts['sig_attempted']+0.02
                      if 'takedowns_landed' in counts and 'takedowns_attempted' in counts:
                          assert counts['takedowns_landed']<=counts['takedowns_attempted']+0.02
          print('Deterministic UFC research scenarios validated:',scenarios)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ufc-projection-coverage
          path: |
            ufc_projection_coverage.json
            ufc_unified_research.json
      - name: Publish research feed on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cp ufc_unified_research.json feed/ufc_unified_research.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feed/ufc_unified_research.json
          if ! git diff --cached --quiet; then
            git commit -m "data(ufc): refresh unified research-only card feed [skip ci]"
            git push
          fi
