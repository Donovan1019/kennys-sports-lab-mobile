name: UFC Projection Coverage Audit
on:
  push:
    branches: [main]
    paths-ignore:
      - 'feed/ufc_unified_research.json'
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run fighter coverage and odds freshness audit
        run: python scripts/ufc_projection_coverage_audit.py | tee ufc_projection_coverage.json
      - name: Run unified five-stage UFC research pipeline
        run: |
          python scripts/ufc_projection_coverage_audit.py --pipeline-output ufc_unified_research.json
          python - <<'PY'
          import json
          from pathlib import Path
          card=json.loads(Path('feed/ufc_research.json').read_text())
          result=json.loads(Path('ufc_unified_research.json').read_text())
          expected={str(f['id']) for f in card['fights'] if f.get('red') and f.get('blue')}
          observed={f['fight_id'] for f in result['fights']}
          assert observed==expected, (expected-observed, observed-expected)
          assert result['bet_eligible'] is False
          assert all(f['betting']['status']=='NOT_ELIGIBLE' and f['betting']['model_ev'] is None for f in result['fights'])
          assert all(abs(f['sparse_data_probability']['red']+f['sparse_data_probability']['blue']-1)<.0002 for f in result['fights'])
          print('Full-card pipeline coverage:',len(observed),'research-only gates PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ufc-projection-coverage
          path: |
            ufc_projection_coverage.json
            ufc_unified_research.json
      - name: Publish research feed on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cp ufc_unified_research.json feed/ufc_unified_research.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feed/ufc_unified_research.json
          if ! git diff --cached --quiet; then
            git commit -m "data(ufc): refresh unified research-only card feed [skip ci]"
            git push
          fi
