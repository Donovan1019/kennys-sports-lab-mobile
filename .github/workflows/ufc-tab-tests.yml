name: Test UFC research tab
on:
  pull_request:
    paths:
      - 'scripts/ufc_winner_history.py'
      - 'tests/test_ufc_winner_history.py'
      - 'scripts/ufc_historical_source.py'
      - 'tests/test_ufc_historical_source.py'
      - 'scripts/ufc_walkforward.py'
      - 'tests/test_ufc_walkforward.py'
      - 'scripts/ufc_fighter_history.py'
      - 'tests/test_ufc_fighter_history.py'
      - 'scripts/ufc_monte_carlo.py'
      - 'tests/test_ufc_monte_carlo.py'
      - 'scripts/ufc_event_ingest.py'
      - 'tests/test_ufc_event_ingest.py'
      - 'ufc.html'
      - 'ufc_lab.js'
      - 'ufc_lab.css'
      - 'feed/ufc_research.json'
      - 'tests/test_ufc_tab.py'
      - 'index.html'
      - 'nfl.html'
      - 'nba.html'
      - 'nhl.html'
      - '.github/workflows/ufc-tab-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify UFC tab integration
        run: python -m unittest discover -s tests -p 'test_ufc*.py' -v
      - name: Check browser JavaScript syntax
        run: node --check ufc_lab.js
