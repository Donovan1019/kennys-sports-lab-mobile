name: Refresh NHL upcoming schedule
on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh public NHL fixtures
        run: python -m scripts.refresh_nhl_schedule
      - name: Publish fixture feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/nhl_independent_game_inputs.json
          git diff --cached --quiet || (git commit -m "Refresh upcoming NHL fixtures" && git push)
