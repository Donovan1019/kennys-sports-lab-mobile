name: NCAAB Odds Snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: '10 15,21 * * *'
permissions:
  contents: write
concurrency:
  group: ncaab-odds-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY || secrets.THE_ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch NCAAB odds (one request, three core markets)
        if: env.ODDS_API_KEY != ''
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.parse,datetime,pathlib
          p=urllib.parse.urlencode({'apiKey':os.environ['ODDS_API_KEY'],'regions':'us','markets':'h2h,spreads,totals','oddsFormat':'american'})
          url='https://api.the-odds-api.com/v4/sports/basketball_ncaab/odds/?'+p
          req=urllib.request.Request(url,headers={'User-Agent':'KennysSportsLab/1.0'})
          with urllib.request.urlopen(req,timeout=35) as r:
              events=json.load(r)
              remaining=r.headers.get('x-requests-remaining','unknown')
          if not isinstance(events,list): raise ValueError('Unexpected API payload')
          path=pathlib.Path('data/ncaab_odds.json')
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps({'sport':'basketball_ncaab','fetched_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'remaining_credits':remaining,'events':events},separators=(',',':'))+'\n')
          print('NCAAB events:',len(events),'remaining credits:',remaining)
          PY
      - name: Report missing secret
        if: env.ODDS_API_KEY == ''
        run: echo 'UNAVAILABLE - set existing Odds API key as ODDS_API_KEY or THE_ODDS_API_KEY in Actions secrets'
      - name: Commit validated snapshot
        if: env.ODDS_API_KEY != ''
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ncaab_odds.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh NCAAB core market odds"
            git push
          fi
