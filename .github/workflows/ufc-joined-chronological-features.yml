name: UFC Joined Chronological Fighter Features
on:
  pull_request:
  workflow_dispatch:
jobs:
  fighter-features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_ufc_joined_chronological_rows.py -v
      - name: Generate fighter history from real UFCStats ID joins
        run: python -m scripts.ufc_joined_chronological_rows --output ufc_historical_fighter_rows.json --features-output ufc_historical_prior_features.json
      - uses: actions/upload-artifact@v4
        with:
          name: ufc-historical-fighter-feature-records
          path: |
            ufc_historical_fighter_rows.json
            ufc_historical_prior_features.json
