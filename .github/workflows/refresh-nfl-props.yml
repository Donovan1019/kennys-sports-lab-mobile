name: Refresh NFL Player Props (Credit-Limited)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-nfl-props.yml'
  workflow_dispatch:
    inputs:
      max_events:
        description: "Upcoming NFL games to query (each may consume multiple API credits)"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch capped NFL player prop odds
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          MAX_EVENTS: ${{ inputs.max_events || '20' }}
          TARGET_DATE: '2026-10-25'
        run: python scripts/fetch_nfl_props.py
      - name: Publish verified prop snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/nfl_props.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh NFL player prop snapshot"
            git push
          fi
