name: Refresh NFL Player Props (Credit-Limited)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-nfl-props.yml'
      - 'scripts/fetch_nfl_props.py'
  schedule:
    - cron: '5 14 * * 0,1,4'
    - cron: '5 16,20,23 * * 0'
    - cron: '5 23 * * 1,4'
  workflow_dispatch:
    inputs:
      max_events:
        description: "Upcoming NFL games to query (each may consume multiple API credits)"
        required: true
        default: "3"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "6"
          - "10"
          - "16"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pregame export and archive integrity
        run: |
          python scripts/test_nfl_prop_event_selection.py
          node scripts/test_nfl_prop_export.cjs
          node scripts/test_nfl_prop_archive.cjs
      - name: Fetch capped NFL player prop odds
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          MAX_EVENTS: ${{ inputs.max_events || '16' }}
          TARGET_DATE: ''
        run: python scripts/fetch_nfl_props.py
      - name: Export and archive genuine pregame forecasts immediately after refresh
        shell: bash
        run: |
          node scripts/export_nfl_prop_forecasts.cjs
          if [ -f feed/nfl_prop_forecast_inbox.json ]; then
            node scripts/archive_nfl_prop_forecasts.cjs feed/nfl_prop_forecast_inbox.json
          else
            echo 'No fresh two-way forecasts qualified; no archived predictions created.'
          fi
      - name: Publish verified prop snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/nfl_props.json feed/nfl_prop_capture_coverage.json
          if [ -f feed/nfl_prop_forecast_ledger.json ]; then git add feed/nfl_prop_forecast_ledger.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Refresh NFL player prop snapshot"
            mkdir -p /tmp/ksl-nfl-refresh
            cp feed/nfl_props.json feed/nfl_prop_capture_coverage.json feed/nfl_prop_forecast_ledger.json /tmp/ksl-nfl-refresh/
            for attempt in 1 2 3; do
              git fetch origin main
              git reset --hard origin/main
              cp /tmp/ksl-nfl-refresh/* feed/
              git add feed/nfl_props.json feed/nfl_prop_capture_coverage.json feed/nfl_prop_forecast_ledger.json
              if git diff --cached --quiet; then exit 0; fi
              git commit -m "Publish NFL full-slate prop capture and pregame archive"
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            echo "Failed to publish NFL prop refresh after 3 attempts" >&2
            exit 1
          fi
