name: NFL Provider Identity Crosswalk Integrity
on:
  pull_request:
    paths:
      - 'scripts/match_nfl_provider_events.py'
      - 'scripts/test_match_nfl_provider_events.py'
      - '.github/workflows/nfl-provider-crosswalk-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test ESPN and sportsbook event crosswalk
        run: python -m unittest scripts/test_match_nfl_provider_events.py
      - name: Audit existing feed identity matches
        run: python scripts/match_nfl_provider_events.py
