name: NFL Independent Score Reconciliation
on:
  workflow_dispatch:
  schedule:
    - cron: '30 12 * * 2,5'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile ESPN completed scores against nflverse
        run: python scripts/reconcile_nflverse_scores.py
      - name: Publish verified reconciliation report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/nfl_independent_score_audit.json
          git diff --cached --quiet || (git commit -m "Refresh NFL independent score reconciliation" && git push)
