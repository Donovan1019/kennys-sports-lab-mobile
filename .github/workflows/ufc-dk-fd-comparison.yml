name: UFC DK FD Comparison Validation
on:
  push:
    branches:
      - feature/ufc-dk-fd-comparison-20261023
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_ufc_dk_fd_compare.py -v
