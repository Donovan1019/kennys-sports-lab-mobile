name: PFL Free API Ingestion (Manual)
on:
  workflow_dispatch:
concurrency:
  group: pfl-free-ingestion
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore PFL fighter-history checkpoint
        uses: actions/cache/restore@v4
        with:
          path: data/pfl/fighter-histories.json
          key: pfl-histories-${{ github.run_id }}
          restore-keys: |
            pfl-histories-
      - name: Verify secret availability without revealing values
        env:
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
          ufccal_key: ${{ secrets.ufccal_key }}
        run: |
          test -n "$CITO_API_KEY" || { echo "CITO_API_KEY not configured"; exit 1; }
          test -n "$ufccal_key" || { echo "ufccal_key not configured"; exit 1; }
      - name: Fetch PFL cards from free Cito allocation
        env:
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
        run: node scripts/pfl_acquire.js
      - name: Test PFL fighter-history pagination before API calls
        run: node tests/pfl_fighter_histories.test.js
      - name: Fetch all scheduled PFL fighter profiles and histories
        env:
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
          PFL_FIGHTER_LIMIT: '100'
          PFL_REQUEST_DELAY_MS: '6500'
        run: node scripts/pfl_fighter_histories.js
      - name: Save PFL fighter-history checkpoint
        if: always() && hashFiles('data/pfl/fighter-histories.json') != ''
        uses: actions/cache/save@v4
        with:
          path: data/pfl/fighter-histories.json
          key: pfl-histories-${{ github.run_id }}
      - name: Audit historical fighter outcomes
        if: always() && hashFiles('data/pfl/fighter-histories.json') != ''
        run: |
          node tests/pfl_history_audit.test.js
          node scripts/pfl_history_audit.js data/pfl/fighter-histories.json | tee data/pfl/history-audit.json
          test "${PIPESTATUS[0]}" -eq 0
      - name: Fetch PFL events from free UFCalendar allocation
        if: always()
        env:
          ufccal_key: ${{ secrets.ufccal_key }}
        run: node scripts/pfl_ufcalendar_acquire.js
      - name: Fetch PFL schedule and events from FighterAPI (optional)
        if: always()
        continue-on-error: true
        env:
          FIGHTERAPI_API_KEY: ${{ secrets.fighterapi_apikey }}
        run: |
          node tests/pfl_fighterapi_acquire.test.js
          node scripts/pfl_fighterapi_acquire.js
      - name: Reconcile FighterAPI with Cito events and verify source mappings
        if: always() && hashFiles('data/pfl/events.json') != ''
        run: |
          node tests/pfl_source_reconciliation.test.js
          node scripts/pfl_source_reconciliation.js
      - name: Audit verified PFL bouts and fighter-history readiness
        if: always() && hashFiles('data/pfl/events.json', 'data/pfl/fighter-histories.json', 'data/pfl/source-reconciliation.json') != ''
        run: |
          node tests/pfl_bout_readiness.test.js
          node scripts/pfl_bout_readiness.js
      - name: Validate snapshots
        if: always() && hashFiles('data/pfl/events.json', 'data/pfl/ufcalendar-events.json') != ''
        run: |
          node -e "const s=require('./pfl_snapshot.js'); const fs=require('fs'); for(const file of ['data/pfl/events.json','data/pfl/ufcalendar-events.json']){const d=JSON.parse(fs.readFileSync(file));const r=globalThis.KSLPFLSnapshot.check(d);if(!r.ok)throw Error(file+': '+r.errors.join('; ')); console.log(file, 'events:',r.events.length)}"
      - name: Audit cross-source fight coverage and betting gaps
        if: always() && hashFiles('data/pfl/events.json', 'data/pfl/ufcalendar-events.json') != ''
        run: |
          node tests/pfl_coverage_audit.test.js
          node scripts/pfl_coverage_audit.js data/pfl/events.json data/pfl/ufcalendar-events.json | tee data/pfl/coverage-audit.json
          test "${PIPESTATUS[0]}" -eq 0
      - name: Upload data for authorized review (not published to site)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pfl-free-api-snapshots
          path: |
            data/pfl/events.json
            data/pfl/ufcalendar-events.json
            data/pfl/coverage-audit.json
            data/pfl/fighter-histories.json
            data/pfl/history-audit.json
            data/pfl/fighterapi-snapshot.json
            data/pfl/source-reconciliation.json
            data/pfl/bout-readiness.json
          retention-days: 3
