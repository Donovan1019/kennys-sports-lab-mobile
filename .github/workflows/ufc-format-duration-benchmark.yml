name: UFC Format Duration Benchmark
on:
  pull_request:
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_ufc_format_duration_benchmark.py -v
      - run: python -m scripts.ufc_format_duration_benchmark --output backtests/reports/ufc_format_duration_benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ufc-format-duration-benchmark
          path: backtests/reports/ufc_format_duration_benchmark.json
