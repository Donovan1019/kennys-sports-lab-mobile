name: Backtest NFL Archived October 25
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/backtest_nfl_archived_20261025.py'
      - '.github/workflows/backtest-nfl-archived-20261025.yml'
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/backtest_nfl_archived_20261025.py
      - uses: actions/upload-artifact@v4
        with:
          name: nfl-archived-replay-20261025
          path: feed/nfl_archived_replay_20261025.json
