name: Test three-sport backtest
on:
  pull_request:
    paths:
      - 'scripts/three_sport_backtest.py'
      - 'tests/test_three_sport_backtest.py'
      - '.github/workflows/three-sport-backtest*.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_three_sport_backtest.py' -v
