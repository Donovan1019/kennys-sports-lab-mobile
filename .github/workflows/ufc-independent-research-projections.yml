name: UFC Independent Research Projections
on:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ufc_fighter_projections.js
      - name: Verify model and market are independent
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('ufc_fighter_projections.js').read_text()
          assert 'function independentWinEstimate' in s
          assert 'function researchProjection' in s
          assert 'UNCALIBRATED SHRUNK HEURISTIC' in s
          assert "marketBaseline(f,fighter)" in s
          assert "researchProjection(f,fighter,stat)" in s
          assert '3-round equivalent' in s
          assert 'ufc_fighter_projections.js?v=7' in Path('ufc.html').read_text()
          PY
