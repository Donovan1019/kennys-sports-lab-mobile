name: UFC Historical Prefix Feature Validation
on:
  pull_request:
  workflow_dispatch:
jobs:
  prior-fight-features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_ufc_historical_prefix_features.py -v
