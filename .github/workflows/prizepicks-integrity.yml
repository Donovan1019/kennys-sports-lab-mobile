name: PrizePicks Research Integrity
on:
  pull_request:
    paths:
      - 'prizepicks*'
      - 'tests/prizepicks*'
      - 'scripts/prizepicks_ingest.js'
      - 'scripts/prizepicks_feed_health.js'
      - '.github/workflows/prizepicks-ingest.yml'
      - '.github/workflows/prizepicks-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'prizepicks*'
      - 'tests/prizepicks*'
      - '.github/workflows/prizepicks-integrity.yml'
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check prizepicks_research.js
      - run: node tests/prizepicks_research.test.js
      - run: node tests/prizepicks_auto_page.test.js
      - run: node --check scripts/prizepicks_ingest.js && node tests/prizepicks_ingest.test.js
      - run: node tests/prizepicks_feed_health.test.js
      - run: node tests/prizepicks_schedule.test.js
      - run: node tests/prizepicks_board_quality.test.js
      - run: node tests/prizepicks_history_evidence.test.js
      - run: node tests/prizepicks_history_join.test.js
      - run: node tests/prizepicks_history_audit.test.js
      - run: node tests/prizepicks_history_source.test.js
      - run: node tests/prizepicks_history_identity.test.js
