name: Collect NBA NHL pregame odds
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify adapter tests
        run: python -m unittest tests.test_collect_the_odds_api tests.test_paired_moneyline_market tests.test_archive_paired_moneylines tests.test_market_consensus tests.test_market_quality_screen tests.test_line_movement_research tests.test_pregame_research tests.test_forecast_ledger
      - name: Fetch fresh odds (requires repository secret)
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: python -m scripts.collect_the_odds_api
      - name: Evaluate independent bookmaker consensus
        run: python -m scripts.market_consensus
      - name: Apply market dispersion quality gates
        run: python -m scripts.market_quality_screen
      - name: Analyze archived bookmaker line movement
        run: python -m scripts.line_movement_research
      - name: Generate strict-prior-day experimental model forecasts
        run: python -m scripts.pregame_research
      - name: Archive timestamped pregame forecasts and audit exact-ID outcomes
        run: python -m scripts.forecast_ledger
      - name: Publish only verified fresh snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in feed/basketball_nba.json feed/icehockey_nhl.json feed/basketball_nba_paired_moneyline_archive.json feed/icehockey_nhl_paired_moneyline_archive.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          for file in feed/basketball_nba_market_consensus.json feed/icehockey_nhl_market_consensus.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          for file in feed/basketball_nba_market_screen.json feed/icehockey_nhl_market_screen.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          for file in feed/basketball_nba_line_movement.json feed/icehockey_nhl_line_movement.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          for file in feed/basketball_nba_pregame_research.json feed/icehockey_nhl_pregame_research.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          for file in feed/basketball_nba_forecast_ledger.json feed/icehockey_nhl_forecast_ledger.json feed/basketball_nba_forecast_outcomes.json feed/icehockey_nhl_forecast_outcomes.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          git diff --cached --quiet || (git commit -m "Archive fresh verified NBA NHL odds snapshots" && git push)
