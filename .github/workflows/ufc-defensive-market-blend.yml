name: UFC Defensive Market Blend
on:
  pull_request:
  workflow_dispatch:
jobs:
  defensive-market:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_ufc_defensive_market_blend.py -v
      - run: python -m scripts.ufc_defensive_market_blend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ufc-defensive-market-blend
          path: ufc_defensive_market_blend.json
