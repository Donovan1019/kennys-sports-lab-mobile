name: UFC Market Residual Audit
on:
  pull_request:
  workflow_dispatch:
jobs:
  residual-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_ufc_market_residual_audit.py -v
      - run: python -m scripts.ufc_market_residual_audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ufc-market-residual-audit
          path: ufc_market_residual_audit.json
