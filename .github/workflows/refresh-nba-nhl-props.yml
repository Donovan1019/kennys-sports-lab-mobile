name: Refresh NBA NHL Player Props (Credit-Limited)
on:
  workflow_dispatch:
    inputs:
      sport:
        description: League
        required: true
        type: choice
        options:
          - nba
          - nhl
      max_events:
        description: Maximum upcoming events (paid API credits per event and market)
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect bounded player-prop quotes
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          SPORT: ${{ inputs.sport }}
          MAX_EVENTS: ${{ inputs.max_events }}
        run: python -m scripts.fetch_nba_nhl_props
      - name: Publish player-prop feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "feed/${{ inputs.sport }}_props.json"
          if [ "${{ inputs.sport }}" = "nba" ]; then git add feed/nba_prop_pregame_ledger.jsonl; fi
          git diff --cached --quiet || (git commit -m "Refresh ${{ inputs.sport }} player prop quotes" && git push)
