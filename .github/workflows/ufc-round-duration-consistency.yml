name: UFC Round Duration Consistency
on:
  pull_request:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_ufc_round_duration_consistency.py -v
      - run: python -m scripts.ufc_round_duration_consistency --output backtests/reports/ufc_round_duration_consistency.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ufc-round-duration-consistency
          path: backtests/reports/ufc_round_duration_consistency.json
