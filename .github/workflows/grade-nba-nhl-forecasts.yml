name: Grade archived NBA NHL NFL forecasts
on:
  workflow_dispatch:
  schedule:
    - cron: '20 11 * * *'
permissions:
  contents: write
concurrency:
  group: nba-nhl-score-publish
  cancel-in-progress: false
jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate outcome matching and refresh adapters
        run: python -m compileall -q scripts tests && python -m unittest tests.test_forecast_ledger tests.test_refresh_recent_results tests.test_nfl_pregame_research tests.test_advanced_forecast_evaluation tests.test_correlated_score_simulation tests.test_score_correlation_research tests.test_correlation_walkforward
      - name: Refresh final scores from free ESPN endpoints
        run: python -m scripts.refresh_recent_results
      - name: Build fresh cross-book market consensus from archived quotes
        run: python -m scripts.market_consensus
      - name: Capture NFL pregame research when verified consensus is available
        run: python -m scripts.nfl_pregame_research
      - name: Score previously archived pregame forecasts
        run: python -m scripts.forecast_ledger
      - name: Evaluate forecast calibration and uncertainty
        run: python -m scripts.advanced_forecast_evaluation
      - name: Estimate historical score correlations for research
        run: python -m scripts.score_correlation_research
      - name: Walk-forward correlated versus independent Monte Carlo
        run: python -m scripts.correlation_walkforward
      - name: Publish verified outcomes without Odds API usage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/nba_completed_games.json feed/nhl_completed_games.json
          for file in feed/basketball_nba_market_consensus.json feed/icehockey_nhl_market_consensus.json feed/americanfootball_nfl_market_consensus.json feed/americanfootball_nfl_pregame_research.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          for file in feed/basketball_nba_forecast_ledger.json feed/icehockey_nhl_forecast_ledger.json feed/americanfootball_nfl_forecast_ledger.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if [ -f feed/nfl_completed_games.json ]; then git add feed/nfl_completed_games.json; fi
          for file in feed/basketball_nba_forecast_outcomes.json feed/icehockey_nhl_forecast_outcomes.json feed/americanfootball_nfl_forecast_outcomes.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          for file in feed/basketball_nba_advanced_evaluation.json feed/icehockey_nhl_advanced_evaluation.json feed/americanfootball_nfl_advanced_evaluation.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          for file in feed/americanfootball_nfl_score_correlation_research.json feed/basketball_nba_score_correlation_research.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          for file in feed/americanfootball_nfl_correlation_backtest.json feed/basketball_nba_correlation_backtest.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          git diff --cached --quiet || (git commit -m "Grade archived NBA NHL forecasts against verified final scores" && git push)
