name: NBA NHL NFL unified pregame and postgame pipeline
on:
  workflow_dispatch:
  schedule:
    # Offset from common :00/:15/:20 boundaries to reduce scheduler contention.
    # Times are UTC; Eastern local display changes with daylight saving time.
    - cron: '23 11 * * *'
    - cron: '17 21 * * *'
permissions:
  contents: write
concurrency:
  group: nba-nhl-score-publish
  cancel-in-progress: false
jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate outcome matching and refresh adapters
        run: python -m compileall -q scripts tests && python -m unittest tests.test_forecast_ledger tests.test_refresh_recent_results tests.test_nfl_pregame_research tests.test_advanced_forecast_evaluation tests.test_correlated_score_simulation tests.test_score_correlation_research tests.test_correlation_walkforward tests.test_model_validation tests.test_three_sport_champion tests.test_three_sport_quote_provenance tests.test_three_sport_lifecycle tests.test_three_sport_player_input_integrity tests.test_nfl_prop_event_match_gates tests.test_nfl_roster_crosscheck
      - name: Apply archived market quality screens
        run: |
          python -m scripts.market_quality_screen
          python -m scripts.line_movement_research
      - name: Generate NBA NHL NFL pregame research from archived quotes
        run: python -m scripts.pregame_research
      - name: Refresh NFL observed player game logs from free nflverse
        run: |
          # Public historical statistics only; preserve the prior snapshot on failure.
          python -m scripts.fetch_nfl_stats || echo "NFL player history unavailable; existing snapshot preserved"
      - name: Cross-check NFL archived props against free ESPN team rosters
        run: |
          # Independent roster research; no paid API or bet-eligible claims.
          python -m scripts.nfl_roster_crosscheck
      - name: Refresh NHL official player histories
        run: |
          # Official NHL game logs, including shots on goal; no betting lines.
          python -m scripts.fetch_nhl_official_stats || echo "NHL official player history unavailable; existing snapshot preserved"
      - name: Refresh NBA regular-season player boxscores from free ESPN data
        env:
          PLAYER_SPORT: nba
          LOOKBACK_DAYS: '4'
        run: |
          # NBA importer preserves verified prior logs and rejects preseason.
          # A failed fetch must not replace existing data or block score grading.
          python -m scripts.fetch_nba_nhl_stats || echo "NBA player history unavailable; existing snapshot preserved"
      - name: Refresh final scores from free ESPN endpoints
        run: python -m scripts.refresh_recent_results
      - name: Build fresh cross-book market consensus from archived quotes
        run: python -m scripts.market_consensus
      - name: Capture NFL pregame research when verified consensus is available
        run: python -m scripts.nfl_pregame_research
      - name: Score previously archived pregame forecasts
        run: python -m scripts.forecast_ledger
      - name: Explain pending versus unmatched forecast outcomes
        run: python -m scripts.three_sport_grading_coverage
      - name: Evaluate forecast calibration and uncertainty
        run: python -m scripts.advanced_forecast_evaluation
      - name: Audit champion versus bookmaker baseline across all three sports
        run: python -m scripts.three_sport_champion
      - name: Audit NBA NHL NFL forecast lifecycle readiness
        run: python -m scripts.three_sport_lifecycle
      - name: Audit historical player inputs and sportsbook quote freshness
        run: python -m scripts.three_sport_player_input_integrity
      - name: Audit verified player recommendation readiness
        run: python -m scripts.player_recommendation_readiness
      - name: Audit free-first pipeline health
        run: python -m unittest tests.test_three_sport_pipeline_health && python -m scripts.three_sport_pipeline_health
      - name: Publish verified outcomes without Odds API usage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/nba_completed_games.json feed/nhl_completed_games.json
          if [ -s feed/nba_player_stats.json ]; then git add feed/nba_player_stats.json; fi
          if [ -s feed/nfl_player_stats.json ]; then git add feed/nfl_player_stats.json; fi
          if [ -s feed/nfl_roster_crosscheck.json ]; then git add feed/nfl_roster_crosscheck.json; fi
          if [ -s feed/nhl_official_player_stats.json ]; then git add feed/nhl_official_player_stats.json; fi
          for sport in basketball_nba icehockey_nhl americanfootball_nfl; do
            for suffix in market_screen line_movement pregame_research; do
              file="feed/${sport}_${suffix}.json"
              if [ -f "$file" ]; then git add "$file"; fi
            done
          done
          for file in feed/basketball_nba_market_consensus.json feed/icehockey_nhl_market_consensus.json feed/americanfootball_nfl_market_consensus.json feed/americanfootball_nfl_pregame_research.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          for file in feed/basketball_nba_forecast_ledger.json feed/icehockey_nhl_forecast_ledger.json feed/americanfootball_nfl_forecast_ledger.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if [ -f feed/nfl_completed_games.json ]; then git add feed/nfl_completed_games.json; fi
          for file in feed/basketball_nba_forecast_outcomes.json feed/icehockey_nhl_forecast_outcomes.json feed/americanfootball_nfl_forecast_outcomes.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          for file in feed/basketball_nba_advanced_evaluation.json feed/icehockey_nhl_advanced_evaluation.json feed/americanfootball_nfl_advanced_evaluation.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          for file in feed/americanfootball_nfl_score_correlation_research.json feed/basketball_nba_score_correlation_research.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          for file in feed/americanfootball_nfl_correlation_backtest.json feed/basketball_nba_correlation_backtest.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          for file in feed/americanfootball_nfl_model_validation.json feed/basketball_nba_model_validation.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          for sport in basketball_nba icehockey_nhl americanfootball_nfl; do
            for suffix in champion_challenger market_baseline_ledger; do
              file="feed/${sport}_${suffix}.json"
              if [ -f "$file" ]; then git add "$file"; fi
            done
          done
          if [ -f feed/three_sport_lifecycle_readiness.json ]; then git add feed/three_sport_lifecycle_readiness.json; fi
          if [ -f feed/three_sport_pipeline_health.json ]; then git add feed/three_sport_pipeline_health.json; fi
          if [ -f feed/player_recommendation_readiness.json ]; then git add feed/player_recommendation_readiness.json; fi
          if [ -f feed/three_sport_player_input_integrity.json ]; then git add feed/three_sport_player_input_integrity.json; fi
          if [ -f feed/three_sport_grading_coverage.json ]; then git add feed/three_sport_grading_coverage.json; fi
          git diff --cached --quiet || (git commit -m "Grade archived NBA NHL forecasts against verified final scores" && git push)
