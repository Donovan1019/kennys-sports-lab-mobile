name: Refresh NFL WR Opportunity Feed
on:
  workflow_dispatch:
  schedule:
    - cron: '30 11 * * 2,4'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download verified nflverse 2026 weekly data
        run: python scripts/fetch_nfl_wr_weekly.py
      - name: Build and validate WR feed
        run: |
          python scripts/build_nfl_wr_opportunity.py --input tmp/nfl_wr_2026_weekly.csv --season 2026
          python - <<'PY'
          import json
          p=json.load(open('feed/nfl_wr_opportunity.json'))
          assert len(p['games'])>=100
          assert len({g['team'] for g in p['games']})>=20
          assert all(g['targets'] is not None for g in p['games'])
          print('Validated',len(p['games']),'rows across',len({g['team'] for g in p['games']}),'teams')
          PY
      - name: Try verified PFR snap-count enrichment
        shell: bash
        run: |
          if python scripts/fetch_nfl_wr_snap_counts.py --season 2026; then
            python scripts/enrich_nfl_wr_opportunity.py --input feed/nfl_wr_opportunity.json --supplement tmp/nfl_wr_snap_counts.csv --source 'nflverse PFR snap counts; exact player IDs' --output feed/nfl_wr_opportunity.json || echo 'Snap enrichment unavailable: no verified matching IDs'
          else
            echo 'Snap source unavailable or incompatible: preserving null values'
          fi
      - name: Apply verified charting export when supplied
        shell: bash
        run: |
          if [ -f data/nfl_wr_verified_charting_2026.csv ]; then
            python scripts/enrich_nfl_wr_opportunity.py --input feed/nfl_wr_opportunity.json --supplement data/nfl_wr_verified_charting_2026.csv --source 'verified charting export; provider attribution required' --output feed/nfl_wr_opportunity.json
          else
            echo 'No authorized charting export supplied; route/first-read/end-zone remain unavailable'
          fi
      - name: Enrich verified charting exports when present
        shell: bash
        run: |
          shopt -s nullglob
          for dataset in data/nfl_wr_verified/*.csv; do
            provider=$(basename "$dataset" .csv)
            python scripts/enrich_nfl_wr_opportunity.py --input feed/nfl_wr_opportunity.json --supplement "$dataset" --source "verified charting export: $provider" --output feed/nfl_wr_opportunity.json
          done
      - name: Audit player-week metric coverage
        run: python scripts/audit_nfl_wr_coverage.py
      - name: Refresh existing Odds API NFL player prop quotes when enabled
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          NFL_WR_PROPS_ENABLED: ${{ vars.NFL_WR_PROPS_ENABLED }}
          NFL_WR_PROP_EVENT_LIMIT: '2'
        run: python scripts/fetch_nfl_wr_prop_odds.py
      - name: Build fail-closed WR betting feed
        run: python -m scripts.build_nfl_wr_betting_feed
      - name: Publish verified data only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add feed/nfl_wr_opportunity.json feed/nfl_wr_coverage.json feed/nfl_wr_betting.json
          if [ -f feed/nfl_wr_prop_odds.json ]; then git add feed/nfl_wr_prop_odds.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified 2026 NFL WR opportunity data"
            git push
          fi
