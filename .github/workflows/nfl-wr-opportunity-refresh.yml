name: Refresh NFL WR Opportunity Feed
on:
  workflow_dispatch:
  schedule:
    - cron: '30 11 * * 2,4'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download verified nflverse 2026 weekly data
        run: python scripts/fetch_nfl_wr_weekly.py
      - name: Build and validate WR feed
        run: |
          python scripts/build_nfl_wr_opportunity.py --input tmp/nfl_wr_2026_weekly.csv --season 2026
          python - <<'PY'
          import json
          p=json.load(open('feed/nfl_wr_opportunity.json'))
          assert len(p['games'])>=100
          assert len({g['team'] for g in p['games']})>=20
          assert all(g['targets'] is not None for g in p['games'])
          print('Validated',len(p['games']),'rows across',len({g['team'] for g in p['games']}),'teams')
          PY
      - name: Try verified PFR snap-count enrichment\n        shell: bash\n        run: |\n          if python scripts/fetch_nfl_wr_snap_counts.py --season 2026; then\n            python scripts/enrich_nfl_wr_opportunity.py --input feed/nfl_wr_opportunity.json --supplement tmp/nfl_wr_snap_counts.csv --source 'nflverse PFR snap counts; exact player IDs' --output feed/nfl_wr_opportunity.json || echo 'Snap enrichment unavailable: no verified matching IDs'\n          else\n            echo 'Snap source unavailable or incompatible: preserving null values'\n          fi\n      - name: Apply verified charting export when supplied\n        shell: bash\n        run: |\n          if [ -f data/nfl_wr_verified_charting_2026.csv ]; then\n            python scripts/enrich_nfl_wr_opportunity.py --input feed/nfl_wr_opportunity.json --supplement data/nfl_wr_verified_charting_2026.csv --source 'verified charting export; provider attribution required' --output feed/nfl_wr_opportunity.json\n          else\n            echo 'No authorized charting export supplied; route/first-read/end-zone remain unavailable'\n          fi\n      - name: Enrich verified charting exports when present\n        shell: bash\n        run: |\n          shopt -s nullglob\n          for dataset in data/nfl_wr_verified/*.csv; do\n            provider=$(basename "$dataset" .csv)\n            python scripts/enrich_nfl_wr_opportunity.py --input feed/nfl_wr_opportunity.json --supplement "$dataset" --source "verified charting export: $provider" --output feed/nfl_wr_opportunity.json\n          done\n      - name: Audit player-week metric coverage\n        run: python scripts/audit_nfl_wr_coverage.py\n      - name: Publish verified data only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add feed/nfl_wr_opportunity.json feed/nfl_wr_coverage.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified 2026 NFL WR opportunity data"
            git push
          fi
