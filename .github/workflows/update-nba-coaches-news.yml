name: Refresh NBA coaches news
on:
  workflow_dispatch:
  schedule:
    - cron: '20 */6 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public coaching news RSS
        run: python scripts/fetch_nba_coaches_news.py
      - name: Commit news snapshot when updated
        run: |
          if [ ! -f feed/nba_coaches_news.json ]; then
            echo "No new verified feed; retaining previous snapshot"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/nba_coaches_news.json
          git diff --cached --quiet || (git commit -m "Refresh attributed NBA coaching news feed" && git push)
