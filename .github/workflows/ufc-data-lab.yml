name: UFC Data Lab Validation
on:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check saved datasets and UFC UI
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          html=Path('ufc.html').read_text()
          js=Path('ufc_data_lab.js').read_text()
          assert 'ufc_data_lab.js' in html and 'ufc-data-lab' in html
          for name in ('ufc_winner_history.json','ufc_elo_baseline.json','ufc_data_health.json','ufc_simulations.json'):
              assert name in js
          history=json.loads(Path('feed/ufc_winner_history.json').read_text())
          health=json.loads(Path('backtests/reports/ufc_data_health.json').read_text())
          sims=json.loads(Path('feed/ufc_simulations.json').read_text())
          assert history['sport']=='UFC' and health['bet_eligible'] is False
          assert sims['bet_eligible'] is False
          assert isinstance(history['fighters'],list)
          PY
