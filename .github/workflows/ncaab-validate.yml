name: Validate NCAAB Module
on:
  pull_request:
    paths:
      - 'ncaab.html'
      - 'ncaab_intelligence.js'
      - 'ncaab_simulator.js'
      - 'ncaab_history.js'
      - 'ncaab_quality.js'
      - 'ncaab_backtest.js'
      - 'ncaab_decision.js'
      - 'scripts/test_ncaab_decision.cjs'
      - 'scripts/ncaab_research_backtest.py'
      - 'scripts/ncaab_team_projections.py'
      - 'scripts/test_ncaab_backtest.py'
      - 'scripts/ncaab_espn_history.py'
      - '.github/workflows/ncaab-prior-season-backfill.yml'
      - 'scripts/ncaab_espn_history.py'
      - 'data/ncaab_*.json'
      - '.github/workflows/ncaab-*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax and data integrity
        run: |
          node --check ncaab_intelligence.js
          node --check ncaab_simulator.js
          node --check ncaab_history.js
          node --check ncaab_quality.js
          node --check ncaab_backtest.js
          node --check ncaab_decision.js
          node scripts/test_ncaab_decision.cjs
          python3 -m py_compile scripts/ncaab_research_backtest.py scripts/ncaab_espn_history.py
          python3 scripts/test_ncaab_backtest.py
          python3 scripts/ncaab_research_backtest.py
          python3 scripts/ncaab_team_projections.py
          python3 - <<'PY'
          import json
          d=json.load(open('data/ncaab_team_projections.json'))
          assert d['research_only'] is True
          assert d['provider']=='espn-public'
          assert all(x['games']>=5 for x in d['coverage'].get('teams',{}).values())
          PY
          python3 - <<'PY'
          import pathlib,re,json,subprocess
          html=pathlib.Path('ncaab.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,flags=re.S)
          for i,script in enumerate(scripts):
              if script.strip():
                  p=pathlib.Path('/tmp/ncaab-inline-%s.js'%i)
                  p.write_text(script)
                  subprocess.run(['node','--check',str(p)],check=True)
          assert 'Market Audit' in html and 'Team Matchups' in html
          assert 'SGP' in html and 'Best Lines' in html
          assert 'ncaab_intelligence.js' in html
          assert 'ncaab_simulator.js' in html
          assert 'ncaab_history.js' in html
          assert 'ncaab_quality.js' in html
          assert 'Model Quality' in html
          assert 'Backtesting' in html
          assert 'ncaab_backtest.js' in html
          assert 'ncaab_decision.js' in html
          assert 'Betting Board' in html
          assert 'ESPN History' in html
          report=json.loads(pathlib.Path('data/ncaab_research.json').read_text())
          assert report['research_only'] is True
          assert report['historical_games']>=report['walk_forward']['games']
          assert report['walk_forward']['status'] in ('RESEARCH_BASELINE','INSUFFICIENT_HISTORY')
          for name in ('data/ncaab_primary.json','data/ncaab_odds.json'):
              p=pathlib.Path(name)
              if not p.exists(): continue
              data=json.loads(p.read_text())
              assert isinstance(data,dict)
              assert isinstance(data.get('fetched_at'),str)
              if 'odds' in name:
                  assert data.get('sport')=='basketball_ncaab'
                  assert isinstance(data.get('events'),list)
              else:
                  assert data.get('provider')=='api-ninjas'
                  assert isinstance(data.get('data',{}).get('games'),list)
          print('NCAAB JavaScript and data schema checks passed')
          PY
