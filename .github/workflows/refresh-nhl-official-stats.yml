name: Refresh NHL Official Player Stats
on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Calendar days in this NHL history batch"
        type: choice
        required: true
        default: '14'
        options:
          - '7'
          - '14'
          - '31'
          - '90'
          - '180'
          - '365'
      start_date:
        description: "Backfill batch end date (YYYY-MM-DD); blank = today"
        type: string
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: nhl-official-stats
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import and validate NHL official boxscores
        env:
          LOOKBACK_DAYS: ${{ inputs.lookback_days }}
          START_DATE: ${{ inputs.start_date }}
        run: python scripts/fetch_nhl_official_stats.py
      - name: Publish official NHL snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/nhl_official_player_stats.json
          git diff --cached --quiet || (git commit -m "Refresh NHL official player stats" && git push)
