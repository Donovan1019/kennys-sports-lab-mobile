name: Refresh NHL Official Player Stats
on:
  schedule:
    - cron: '35 11 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-nhl-official-stats.yml'
      - 'scripts/fetch_nhl_official_stats.py'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Calendar days in this NHL history batch"
        type: choice
        required: true
        default: '14'
        options:
          - '7'
          - '14'
          - '31'
          - '90'
          - '180'
          - '365'
      start_date:
        description: "Backfill batch end date (YYYY-MM-DD); blank = today"
        type: string
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: nhl-official-stats
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import and validate NHL official boxscores
        env:
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '31' }}
          START_DATE: ${{ inputs.start_date }}
        run: python scripts/fetch_nhl_official_stats.py
      - name: Publish official NHL snapshot with concurrent-push retry
        run: |
          cp feed/nhl_official_player_stats.json /tmp/nhl-official-verified.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --hard HEAD
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B main origin/main
            cp /tmp/nhl-official-verified.json feed/nhl_official_player_stats.json
            git add feed/nhl_official_player_stats.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Refresh NHL official player stats [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            echo "Concurrent update; retrying NHL archive publish ($attempt)"
          done
          exit 1
