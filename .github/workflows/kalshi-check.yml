name: Kalshi module checks
on:
  pull_request:
    paths:
      - 'kalshi.js'
      - 'kalshi.html'
      - '.github/workflows/kalshi-check.yml'
  push:
    paths:
      - 'kalshi.js'
      - 'kalshi.html'
      - '.github/workflows/kalshi-check.yml'
jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check kalshi.js
      - name: Snapshot collector syntax
        run: python3 -m py_compile scripts/collect_kalshi.py
      - name: HTML and safety checks
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const assert = require('assert');
          const html = fs.readFileSync('kalshi.html','utf8');
          const js = fs.readFileSync('kalshi.js','utf8');
          for (const id of ['sport','refresh','status','markets','ticker','search','sort','favoritesOnly','count']) assert(html.includes('id="'+id+'"'), 'Missing '+id);
          assert(js.includes('external-api.kalshi.com'), 'Kalshi feed missing');
          assert(!/\/portfolio\/orders|\/portfolio\/positions|createOrder/i.test(js), 'Trading endpoint detected');
          assert(js.includes('UNVERIFIED') && js.includes('UNAVAILABLE'), 'Unverified safeguards missing');
          assert(html.includes('kalshi.js'), 'Script not loaded');
          assert(js.includes('Use YES ask in calculator'), 'Visible market-to-calculator button missing');
          assert(js.includes('const movements=new Map()'), 'Movement history state missing');
          assert(js.includes('./data/kalshi-markets.json'), 'CORS-safe snapshot fallback missing');
          assert(js.includes('STALE'), 'Stale snapshot warning missing');
          assert(js.includes('movements.set(m.ticker,p-old)'), 'Movement refresh calculation missing');
          assert(!js.includes('lastSeen.set('), 'Undefined lastSeen tracking regression');
          assert(js.includes('selectedMarket'), 'Selected market state missing');
          assert(js.includes('ksl-kalshi-favorites'), 'Favorites persistence missing');
          assert(js.includes('findIndex(x=>x.ticker===m.ticker)'), 'Duplicate market guard missing');
          assert(js.includes('request!==latestRequest'), 'Stale request protection missing');
          assert(js.includes('queued=true'), 'Queued refresh protection missing');
          assert(html.includes('prop_research_theme.css'), 'Shared research theme stylesheet missing');
          assert(html.includes('id="ksl-global-nav"'), 'Unified navigation styling hook missing');
          console.log('Kalshi static checks passed');
          NODE
