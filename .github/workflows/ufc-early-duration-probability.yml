name: UFC Early Duration Probability
on:
  pull_request:
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_ufc_early_duration_probability.py -v
      - run: python -m scripts.ufc_early_duration_probability --output backtests/reports/ufc_early_duration_probability.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ufc-early-duration-probability
          path: backtests/reports/ufc_early_duration_probability.json
