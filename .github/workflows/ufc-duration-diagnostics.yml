name: UFC Duration Historical Diagnostics
on:
  pull_request:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_ufc_duration_diagnostics.py -v
      - run: python -m scripts.ufc_duration_diagnostics --output backtests/reports/ufc_duration_diagnostics.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ufc-duration-diagnostics
          path: backtests/reports/ufc_duration_diagnostics.json
