name: Archive NFL Pregame Prop Forecasts
on:
  workflow_dispatch:
  schedule:
    - cron: '20 14 * * *'
  push:
    branches: [main]
    paths:
      - 'feed/nfl_prop_forecast_inbox.json'
      - 'scripts/archive_nfl_prop_forecasts.cjs'
      - 'scripts/export_nfl_prop_forecasts.cjs'
      - 'scripts/test_nfl_prop_export.cjs'
      - 'feed/nfl_props.json'
      - 'feed/nfl_player_stats.json'
      - 'scripts/grade_nfl_prop_forecasts.cjs'
      - 'scripts/import_nfl_verified_player_outcomes.py'
      - 'scripts/test_nfl_verified_outcomes.py'
      - 'scripts/test_nfl_prop_grader.cjs'
      - 'scripts/audit_nfl_prop_calibration.cjs'
      - 'feed/nfl_prop_verified_outcomes.json'
      - 'scripts/test_nfl_prop_archive.cjs'
      - 'scripts/build_nfl_full_slate_dashboard.py'
      - '.github/workflows/archive-nfl-prop-forecasts.yml'
permissions:
  contents: write
concurrency:
  group: nfl-prop-forecast-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate archive implementation
        run: node scripts/test_nfl_prop_archive.cjs
      - name: Test independent NFL prop outcome grader
        run: node scripts/test_nfl_prop_grader.cjs
      - name: Test first-party NFL pregame export
        run: node scripts/test_nfl_prop_export.cjs
      - name: Export first-party pregame research predictions
        run: node scripts/export_nfl_prop_forecasts.cjs
      - name: Archive only supplied genuine pregame forecasts
        shell: bash
        run: |
          if [ ! -f feed/nfl_prop_forecast_inbox.json ]; then
            echo "No pregame forecast export supplied; no records created."
            exit 0
          fi
          node scripts/archive_nfl_prop_forecasts.cjs feed/nfl_prop_forecast_inbox.json
      - name: Test independent NFL final player stat extraction
        run: python scripts/test_nfl_verified_outcomes.py
      - name: Import independently verified final NFL player box scores
        run: python scripts/import_nfl_verified_player_outcomes.py
      - name: Grade exact-event verified outcomes when available
        run: node scripts/grade_nfl_prop_forecasts.cjs
      - name: Audit graded NFL prop accuracy when evidence exists
        shell: bash
        run: |
          if [ ! -f feed/nfl_prop_graded_snapshots.json ]; then
            echo 'No independently graded prop archive; calibration remains UNVERIFIED.'
            exit 0
          fi
          node -e 'const fs=require("fs");const a=JSON.parse(fs.readFileSync("feed/nfl_prop_graded_snapshots.json","utf8"));if(!Array.isArray(a))process.exit(2);if(!a.length){console.log("No graded forecasts yet; calibration remains UNVERIFIED.");process.exit(3)}' || status=$?
          if [ "${status:-0}" -eq 3 ]; then exit 0; fi
          if [ "${status:-0}" -ne 0 ]; then exit "${status}"; fi
          KSL_PROP_REPORT_PATH=reports/nfl_prop_calibration.json node scripts/audit_nfl_prop_calibration.cjs feed/nfl_prop_graded_snapshots.json
      - name: Upload NFL prop calibration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-prop-calibration-evidence
          path: reports/nfl_prop_calibration.json
          if-no-files-found: ignore
      - name: Build full-slate results and readiness dashboard
        run: python scripts/build_nfl_full_slate_dashboard.py
      - name: Commit immutable archive
        shell: bash
        run: |
          if [ ! -f feed/nfl_prop_forecast_ledger.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for file in feed/nfl_prop_forecast_ledger.json feed/nfl_prop_graded_snapshots.json feed/nfl_prop_verified_outcomes.json feed/nfl_full_slate_dashboard.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Archive verified pregame NFL player prop predictions'
            # Generated files are authoritative outputs of this run. Preserve them
            # across unrelated concurrent commits without a fragile text rebase.
            mkdir -p /tmp/ksl-nfl-archive
            cp feed/nfl_prop_forecast_ledger.json feed/nfl_prop_graded_snapshots.json feed/nfl_prop_verified_outcomes.json feed/nfl_full_slate_dashboard.json /tmp/ksl-nfl-archive/
            for attempt in 1 2 3; do
              git fetch origin main
              git reset --hard origin/main
              cp /tmp/ksl-nfl-archive/* feed/
              git add feed/nfl_prop_forecast_ledger.json feed/nfl_prop_graded_snapshots.json feed/nfl_prop_verified_outcomes.json feed/nfl_full_slate_dashboard.json
              if git diff --cached --quiet; then exit 0; fi
              git commit -m 'Reconcile verified NFL player prop grades and opponents'
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            echo 'Failed to publish reconciled NFL outcomes after 3 attempts' >&2
            exit 1
          fi
