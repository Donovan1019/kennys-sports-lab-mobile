name: UFC Bout Monte Carlo Research
on:
  pull_request:
  workflow_dispatch:
jobs:
  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_ufc_bout_monte_carlo.py -v
