name: Build NFL Defensive Comparison
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_nfl_defensive_comparison.py'
      - '.github/workflows/build-nfl-defensive-comparison.yml'
  schedule:
    - cron: '15 11 * * *'
permissions:
  contents: write
concurrency:
  group: nfl-defensive-comparison
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build observed NFL opponent defense splits
        run: python scripts/build_nfl_defensive_comparison.py
      - name: Commit matchup comparison snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/americanfootball_nfl_defensive_comparison.json
          git diff --cached --quiet || (git commit -m "Refresh NFL observed defensive matchup splits" && git push)
