name: NCAAB verified odds recovery
on:
  workflow_dispatch:
  schedule:
    - cron: '15 15,21 * * *'
permissions:
  contents: write
concurrency:
  group: ncaab-verified-odds
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh and validate odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: python scripts/refresh_ncaab_verified_odds.py
      - name: Commit verified snapshot only
        run: |
          if git diff --quiet -- data/ncaab_odds.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ncaab_odds.json
          git commit -m "data: refresh verified NCAAB odds"
          git pull --rebase origin main
          git push origin HEAD:main
