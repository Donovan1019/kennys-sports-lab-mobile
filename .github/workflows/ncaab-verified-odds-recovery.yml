name: NCAAB verified odds recovery
on:
  workflow_dispatch:
  schedule:
    - cron: '15 15,21 * * *'
permissions:
  contents: write
concurrency:
  group: ncaab-verified-odds
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh NCAA odds from existing SportsGameOdds API
        env:
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
          ODDS_SPORT: basketball_ncaab
          ODDS_MARKETS: h2h,spreads,totals
        run: |
          python scripts/fetch_sportsgameodds.py
          python scripts/convert_ncaab_sgo_odds.py
      - name: Commit verified snapshot only
        run: |
          if git diff --quiet -- data/ncaab_odds.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ncaab_odds.json
          git commit -m "data: refresh verified NCAAB odds"
          # SportsGameOdds also generates feed/*.json; keep those uncommitted files out of this publication.\n          git restore --worktree -- feed/basketball_ncaab.json feed/latest.json 2>/dev/null || true\n          git pull --rebase origin main
          git push origin HEAD:main
