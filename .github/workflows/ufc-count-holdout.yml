name: UFC Count Holdout Diagnostics
on:
  pull_request:
  workflow_dispatch:
jobs:
  holdout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_ufc_count_holdout.py -v
      - run: python -m scripts.ufc_count_holdout --output backtests/reports/ufc_count_holdout.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ufc-count-holdout-report
          path: backtests/reports/ufc_count_holdout.json
