name: UFC Moneyline Odds Auto Refresh
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ufc-odds-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate odds feed adapter
        run: python -m unittest discover -s tests -p test_ufc_refresh_odds.py -v
      - name: Diagnose existing secret wiring
        env:
          PRIMARY_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          FALLBACK_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ -n "$PRIMARY_KEY" ]; then echo 'Existing THE_ODDS_API_KEY is configured'; elif [ -n "$FALLBACK_KEY" ]; then echo 'Fallback ODDS_API_KEY is configured'; else echo 'No supported odds API secret is configured'; exit 1; fi
      - name: Refresh from configured provider
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: python scripts/ufc_refresh_odds.py
      - name: Publish updated odds
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feed/mma_mixed_martial_arts.json
          git diff --cached --quiet || (git commit -m 'Refresh UFC moneyline odds' && git push)
