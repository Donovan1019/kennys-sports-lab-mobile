name: PrizePicks Automated Raw Line Feed
on:
  workflow_dispatch:
  schedule:
    - cron: '0 14,15,20,21 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/prizepicks_ingest.js'
      - 'scripts/prizepicks_history_identity.js'
      - 'scripts/prizepicks_history_automation.js'
      - 'scripts/prizepicks_history_source.js'
      - 'scripts/prizepicks_nflverse_bridge.js'
      - 'tests/prizepicks_history_automation.test.js'
      - '.github/workflows/prizepicks-ingest.yml'
  pull_request:
    paths:
      - 'scripts/prizepicks_ingest.js'
      - 'tests/prizepicks_ingest.test.js'
      - 'scripts/prizepicks_history_identity.js'
      - 'scripts/prizepicks_history_automation.js'
      - 'scripts/prizepicks_history_source.js'
      - 'scripts/prizepicks_nflverse_bridge.js'
      - 'tests/prizepicks_history_automation.test.js'
      - '.github/workflows/prizepicks-ingest.yml'
concurrency:
  group: prizepicks-raw-line-publish
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/prizepicks_ingest.js && node tests/prizepicks_ingest.test.js && node tests/prizepicks_history_automation.test.js
      - name: Eastern schedule gate
        id: eastern
        run: |
          hour=$(TZ=America/New_York date +%H)
          if [ "${{ github.event_name }}" != 'schedule' ] || [ "$hour" = '10' ] || [ "$hour" = '16' ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch authenticated source lines
        if: github.event_name != 'pull_request' && steps.eastern.outputs.run == 'true'
        env:
          PRIZEPICKS_API_KEY: ${{ secrets.PRIZEPICKS_API_KEY }}
        run: node scripts/prizepicks_ingest.js
      - name: Refresh latest audited NFL archive before research join
        if: github.event_name != 'pull_request' && steps.eastern.outputs.run == 'true'
        run: |
          git fetch origin main
          git show origin/main:feed/nfl_player_stats.json > /tmp/prizepicks-nfl-player-stats.json
          git show origin/main:feed/nfl_player_stats_audit.json > /tmp/prizepicks-nfl-player-stats-audit.json
      - name: Build fail-closed historical research audit
        if: github.event_name != 'pull_request' && steps.eastern.outputs.run == 'true'
        env:
          PRIZEPICKS_NFL_ARCHIVE_PATH: /tmp/prizepicks-nfl-player-stats.json
          PRIZEPICKS_NFL_ARCHIVE_AUDIT_PATH: /tmp/prizepicks-nfl-player-stats-audit.json
        run: node scripts/prizepicks_history_automation.js
      - name: Validate audit artifact and source provenance
        if: github.event_name != 'pull_request' && steps.eastern.outputs.run == 'true'
        run: |
          node -e "const fs=require('fs'); const a=JSON.parse(fs.readFileSync('feed/prizepicks_history_audit.json')); const f=JSON.parse(fs.readFileSync('feed/prizepicks_lines.json')); if(!a.inputs || a.inputs.nflArchive!=='FOUND' || f.status!=='RAW_LINES_ONLY' || a.betEligible!==false || !Array.isArray(a.rows) || a.coverage?.total!==f.lines.length || a.coverage?.matched+a.coverage?.unavailable!==a.coverage?.total)process.exit(1); console.log(JSON.stringify({audit:a.status,reason:a.reason,inputs:a.inputs,coverage:a.coverage}));"
      - name: Upload automated research diagnostics
        if: github.event_name != 'pull_request' && steps.eastern.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: prizepicks-research-diagnostics
          if-no-files-found: warn
          path: |
            feed/prizepicks_lines.json
            feed/prizepicks_history_audit.json
      - name: Publish fresh feed
        if: github.event_name != 'pull_request' && steps.eastern.outputs.run == 'true'
        run: |
          cp feed/prizepicks_lines.json /tmp/prizepicks-lines-publish.json
          cp feed/prizepicks_history_audit.json /tmp/prizepicks-history-audit-publish.json
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/prizepicks-lines-publish.json feed/prizepicks_lines.json
          cp /tmp/prizepicks-history-audit-publish.json feed/prizepicks_history_audit.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feed/prizepicks_lines.json feed/prizepicks_history_audit.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh PrizePicks source lines [skip ci]'
            git push origin HEAD:main
          fi
