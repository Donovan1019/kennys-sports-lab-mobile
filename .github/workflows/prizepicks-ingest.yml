name: PrizePicks Automated Raw Line Feed
on:
  workflow_dispatch:
  schedule:
    - cron: '7 12,23 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/prizepicks_ingest.js'
      - '.github/workflows/prizepicks-ingest.yml'
  pull_request:
    paths:
      - 'scripts/prizepicks_ingest.js'
      - 'tests/prizepicks_ingest.test.js'
      - '.github/workflows/prizepicks-ingest.yml'
jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/prizepicks_ingest.js && node tests/prizepicks_ingest.test.js
      - name: Fetch authenticated source lines
        if: github.event_name != 'pull_request'
        env:
          PRIZEPICKS_API_KEY: ${{ secrets.PRIZEPICKS_API_KEY }}
        run: node scripts/prizepicks_ingest.js
      - name: Publish fresh feed
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feed/prizepicks_lines.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh PrizePicks source lines [skip ci]'
            git push
          fi
