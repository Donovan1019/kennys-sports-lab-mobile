name: UFC Count Prop Historical Audit
on:
  pull_request:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_ufc_count_prop_audit.py -v
      - run: python -m scripts.ufc_count_prop_audit --output backtests/reports/ufc_count_prop_audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ufc-count-prop-historical-audit
          path: backtests/reports/ufc_count_prop_audit.json
