name: NCAAB Prior-Season Backfill
on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Historical range start YYYY-MM-DD'
        required: true
        default: '2025-11-01'
      end_date:
        description: 'Historical range end YYYY-MM-DD'
        required: true
        default: '2026-04-10'
      max_new:
        description: 'Maximum new boxscores this batch (1-900)'
        required: true
        default: '600'
permissions:
  contents: write
concurrency:
  group: ncaab-espn-enrichment
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Backfill prior-season games from ESPN
        env:
          NCAAB_ESPN_START_DATE: ${{ inputs.start_date || '2025-11-01' }}
          NCAAB_ESPN_END_DATE: ${{ inputs.end_date || '2026-04-10' }}
          NCAAB_ESPN_MAX_NEW: ${{ inputs.max_new || '600' }}
        run: python3 scripts/ncaab_espn_history.py
      - name: Validate historical coverage
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('data/ncaab_espn_history.json'))
          ids=[g['event_id'] for g in d['games']]
          assert len(ids)==len(set(ids))
          assert all(len(g['teams'])==2 and all(t.get('points') is not None for t in g['teams']) for g in d['games'])
          print('Verified historical games:',len(ids))
          PY
      - name: Run date-safe walk-forward backtest
        run: python3 scripts/ncaab_research_backtest.py
      - name: Commit verified historical data and diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ncaab_espn_history.json data/ncaab_research.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: backfill NCAAB prior-season ESPN results'
            git pull --rebase
            git push
          fi
