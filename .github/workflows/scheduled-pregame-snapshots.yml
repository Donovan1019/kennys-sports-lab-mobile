name: Scheduled Pregame Snapshot Archive
on:
  workflow_dispatch:
    inputs:
      refresh_nba_player_props:
        description: 'Spend existing Odds API credits to refresh one NBA event before capture?'
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '41 14 * * *'
    - cron: '41 21 * * *'
permissions:
  contents: write
concurrency:
  group: scheduled-pregame-snapshots
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Refresh NBA player props when explicitly requested
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_nba_player_props == true }}
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          SPORT: nba
          MAX_EVENTS: '1'
        run: python -m scripts.fetch_nba_nhl_props
      - name: Capture immutable pregame snapshots from available feeds
        run: python -m scripts.three_sport_backtest capture
      - name: Capture verified NBA pregame quote ledger without illustrated picks
        run: python -m scripts.nba_automation_batch
      - name: Generate NBA historical research candidates (not betting picks)
        run: python -m scripts.nba_research_candidates
      - name: Run chronological NBA player walk-forward research audit
        run: python -m scripts.nba_player_walkforward_research
      - name: Capture only actual saved NBA SGP model recommendations
        run: python -m scripts.nba_sgp_model_ledger_bridge
      - name: Grade saved NBA player props and explicit SGP combinations
        run: python -m scripts.grade_nba_sgp_props
      - name: Archive snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.refresh_nba_player_props }}" = "true" ]; then git add feed/nba_props.json; fi
          git add backtests/snapshots/ feed/nba_player_walkforward_research.json feed/nba_model_candidates.json feed/nba_automation_coverage.json feed/nba_sgp_model_capture_status.json feed/nba_prop_pregame_grades.json feed/nba_sgp_pregame_grades.json
          if [ -f feed/nba_prop_pregame_ledger.jsonl ]; then git add feed/nba_prop_pregame_ledger.jsonl; fi
          if [ -f feed/nba_sgp_pregame_ledger.jsonl ]; then git add feed/nba_sgp_pregame_ledger.jsonl; fi
          if ! git diff --cached --quiet; then
            git commit -m "Archive scheduled pregame snapshots"
            git pull --rebase
            git push
          fi
