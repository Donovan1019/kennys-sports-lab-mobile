name: Scheduled Pregame Snapshot Archive
on:
  schedule:
    - cron: '41 14 * * *'
    - cron: '41 21 * * *'
permissions:
  contents: write
concurrency:
  group: scheduled-pregame-snapshots
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Capture immutable pregame snapshots from available feeds
        run: python -m scripts.three_sport_backtest capture
      - name: Archive snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtests/snapshots/
          if ! git diff --cached --quiet; then
            git commit -m "Archive scheduled pregame snapshots"
            git pull --rebase
            git push
          fi
