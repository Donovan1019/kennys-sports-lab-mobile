name: Line Movement Research
on:
  pull_request:
    paths:
      - 'line-movements.html'
      - 'index.html'
      - 'scripts/*line_movement*'
      - '.github/workflows/line-movement-research.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/*line_movement*'
      - '.github/workflows/line-movement-research.yml'
      - 'feed/*_paired_moneyline_archive.json'
  workflow_dispatch:
  schedule:
    - cron: '15 15,22 * * *'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest scripts.test_line_movement_research
      - name: Refresh core odds using existing SportsGameOdds secret
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
        run: |
          for sport in basketball_nba americanfootball_nfl icehockey_nhl basketball_ncaab mma_mixed_martial_arts; do
            markets=h2h,spreads,totals
            if [ "$sport" = mma_mixed_martial_arts ]; then markets=h2h; fi
            ODDS_SPORT="$sport" ODDS_MARKETS="$markets" python scripts/fetch_sportsgameodds.py || echo "::warning::Fresh odds unavailable for $sport; retaining previous snapshot"
          done
      - run: python -m scripts.line_movement_capture
      - run: python -m scripts.line_movement_research
      - uses: actions/upload-artifact@v4
        with:
          name: line-movement-research
          path: feed/*_line_movement.json
          if-no-files-found: error
      - name: Publish verified research feeds
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feed/*_line_movement.json feed/*_core_movement_archive.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish verified line movement research'
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git reset --hard origin/main
            python -m scripts.line_movement_capture
            python -m scripts.line_movement_research
            git add feed/*_line_movement.json feed/*_core_movement_archive.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish verified line movement research'
            sleep 2
          done
          exit 1
