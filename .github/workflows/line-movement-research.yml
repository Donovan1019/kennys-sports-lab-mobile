name: Line Movement Research
on:
  pull_request:
    paths:
      - 'line-movements.html'
      - 'index.html'
      - 'scripts/*line_movement*'
      - '.github/workflows/line-movement-research.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/*line_movement*'
      - '.github/workflows/line-movement-research.yml'
      - 'feed/*_paired_moneyline_archive.json'
  workflow_dispatch:
  schedule:
    - cron: '15 15,22 * * *'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest scripts.test_line_movement_research
      - run: python -m scripts.line_movement_capture
      - run: python -m scripts.line_movement_research
      - uses: actions/upload-artifact@v4
        with:
          name: line-movement-research
          path: feed/*_line_movement.json
          if-no-files-found: error
      - name: Publish verified research feeds
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feed/*_line_movement.json feed/*_core_movement_archive.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish verified line movement research'
          git push origin HEAD:main
