name: UFC Calibration and Temporal Robustness
on:
  pull_request:
  workflow_dispatch:
jobs:
  calibration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_ufc_calibration_diagnostics.py -v
      - run: python -m scripts.ufc_opponent_walkforward --output ufc_calibration_report.json
      - uses: actions/upload-artifact@v4
        with:
          name: ufc-calibration-research
          path: ufc_calibration_report.json
