name: Refresh NBA and NHL Player Stats
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-nba-nhl-stats.yml'
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:
    inputs:
      sport:
        description: "Which league to refresh?"
        type: choice
        required: true
        default: nba
        options:
          - nba
          - nhl
      start_date:
        description: "End date for historical backfill batch (YYYY-MM-DD); blank = today"
        required: false
        type: string
        default: ''
      lookback_days:
        description: "Calendar days to scan (NBA up to 400, NHL up to 31)"
        type: choice
        required: true
        default: '7'
        options:
          - '3'
          - '7'
          - '14'
          - '31'
          - '90'
          - '180'
          - '365'
          - '400'
permissions:
  contents: write
concurrency:
  group: manual-player-stats
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch verified NBA or NHL boxscores
        env:
          PLAYER_SPORT: ${{ inputs.sport || 'nba' }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '45' }}
          START_DATE: ${{ inputs.start_date || '' }}
        run: python scripts/fetch_nba_nhl_stats.py
      - name: Backtest NBA player stats against strictly later games (research only)
        continue-on-error: true
        if: ${{ (inputs.sport || 'nba') == 'nba' }}
        run: python scripts/nba_player_walkforward_research.py
      - name: Audit historical same-game player pairs (research only)
        continue-on-error: true
        if: ${{ (inputs.sport || 'nba') == 'nba' }}
        run: python scripts/nba_sgp_pair_research.py
      - name: Commit verified NBA player snapshot with concurrent-push retry
        run: |
          cp feed/nba_player_stats.json /tmp/nba-player-verified.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --hard HEAD
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B main origin/main
            cp /tmp/nba-player-verified.json feed/nba_player_stats.json
            git add feed/nba_player_stats.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Refresh NBA player stats [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            echo "Concurrent update; retrying NBA archive publish ($attempt)"
          done
          exit 1
