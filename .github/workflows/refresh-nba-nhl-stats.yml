name: Refresh NBA and NHL Player Stats
on:
  workflow_dispatch:
    inputs:
      sport:
        description: "Which league to refresh?"
        type: choice
        required: true
        default: nba
        options:
          - nba
          - nhl
      lookback_days:
        description: "Completed games to check (1-31 days)"
        type: choice
        required: true
        default: '7'
        options:
          - '3'
          - '7'
          - '14'
          - '31'
permissions:
  contents: write
concurrency:
  group: manual-player-stats
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch verified NBA or NHL boxscores
        env:
          PLAYER_SPORT: ${{ inputs.sport }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days }}
        run: python scripts/fetch_nba_nhl_stats.py
      - name: Commit verified league snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/${{ inputs.sport }}_player_stats.json
          git diff --cached --quiet || (git commit -m "Refresh verified ${{ inputs.sport }} player logs" && git push)
