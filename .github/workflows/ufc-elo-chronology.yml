name: UFC Elo Chronological Integrity
on:
  pull_request:
    paths:
      - 'scripts/ufc_elo_baseline.py'
      - 'scripts/ufc_import_historical_csv.py'
      - 'scripts/ufc_betting_certification.py'
      - 'scripts/ufc_market_holdout.py'
      - 'scripts/ufc_match_historical_odds.py'
      - 'tests/test_ufc_match_historical_odds.py'
      - 'scripts/ufc_historical_odds_candidates.py'
      - 'tests/test_ufc_historical_odds_candidates.py'
      - 'tests/test_ufc_market_holdout.py'
      - 'tests/test_ufc_betting_certification.py'
      - 'tests/test_ufc_import_historical_csv.py'
      - 'tests/test_ufc_elo_chronology.py'
      - '.github/workflows/ufc-elo-chronology.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_ufc_elo_chronology.py' -v
      - run: python -m unittest discover -s tests -p 'test_ufc_import_historical_csv.py' -v
      - run: python -m unittest discover -s tests -p 'test_ufc_betting_certification.py' -v
      - run: python -m unittest discover -s tests -p 'test_ufc_market_holdout.py' -v
      - run: python -m unittest discover -s tests -p 'test_ufc_match_historical_odds.py' -v
      - run: python -m unittest discover -s tests -p 'test_ufc_historical_odds_candidates.py' -v
      - name: Verify historical input provenance support
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('scripts/ufc_elo_baseline.py').read_text()
          assert 'input_sha256' in s and 'hashlib.sha256(raw)' in s
          assert 'input_path' in s
          PY
