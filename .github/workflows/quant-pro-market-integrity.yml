name: Quant Pro Market Integrity
on:
  pull_request:
    paths:
      - 'scripts/build_market_edges.py'
      - 'tests/test_market_edge_feed.py'
      - '.github/workflows/quant-pro-market-integrity.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_market_edge_feed.py' -v
