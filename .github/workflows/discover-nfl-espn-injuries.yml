name: Discover Free ESPN NFL Injury Feed
on:
  pull_request:
    paths:
      - 'scripts/discover_nfl_espn_injuries.py'
      - '.github/workflows/discover-nfl-espn-injuries.yml'
  workflow_dispatch:
  schedule:
    - cron: '25 14,18,22 * * 0,1,4'
permissions:
  contents: write
concurrency:
  group: nfl-espn-injury-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test schema discovery
        run: python scripts/test_nfl_espn_discovery.py
      - name: Probe free ESPN injury endpoint
        run: python scripts/discover_nfl_espn_injuries.py
      - name: Upload schema diagnostic for review
        uses: actions/upload-artifact@v4
        with:
          name: nfl-espn-injury-schema
          path: feed/nfl_injury_espn_discovery.json
          retention-days: 7
      - name: Commit schema health only, never unverified players
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/nfl_injury_espn_discovery.json
          git diff --cached --quiet || (git commit -m "Record ESPN NFL injury schema discovery" && git push)
