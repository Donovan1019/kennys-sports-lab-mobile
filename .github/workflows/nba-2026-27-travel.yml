name: NBA 2026-27 Travel Feed
on:
  workflow_dispatch:
  schedule:
    - cron: '20 10 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build official NBA schedule travel feed
        run: python scripts/build_nba_2026_27_travel.py
      - name: Commit refreshed travel data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/nba_2026_27_b2b.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh NBA 2026-27 travel schedule"
            git push
          fi
