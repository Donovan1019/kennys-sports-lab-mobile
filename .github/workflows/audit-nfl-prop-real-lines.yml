name: Audit NFL Real-Line Prop Backtest
on:
  schedule:
    - cron: '35 16 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_nfl_prop_real_lines.py'
      - 'scripts/test_nfl_prop_real_line_audit.py'
      - '.github/workflows/audit-nfl-prop-real-lines.yml'
permissions:
  contents: write
concurrency:
  group: nfl-real-line-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test historical snapshot audit safeguards
        run: python scripts/test_nfl_prop_real_line_audit.py
      - name: Recalculate existing archived real-line results
        run: python scripts/audit_nfl_prop_real_lines.py
      - name: Publish research-only audit when changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            # Recompute against the latest archived graded snapshots on main,
            # rather than publishing a stale result calculated before a concurrent grade.
            python scripts/test_nfl_prop_real_line_audit.py
            python scripts/audit_nfl_prop_real_lines.py
            git add feed/nfl_prop_real_line_backtest.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Update NFL real-line research backtest"
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          echo "Failed to publish NFL real-line audit" >&2
          exit 1
