name: UFC Forecast Ledger Validation
on:
  pull_request:
  workflow_dispatch:
jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_ufc_forecast_ledger.py' -v
