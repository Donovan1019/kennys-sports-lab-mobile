name: NFL SGP Readiness Integration
on:
  pull_request:
    paths:
      - 'scripts/audit_nfl_sgp_readiness.py'
      - 'tests/test_nfl_sgp_readiness.py'
      - '.github/workflows/nfl-sgp-readiness-integration.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/audit_nfl_sgp_readiness.py'
      - 'tests/test_nfl_sgp_readiness.py'
      - '.github/workflows/nfl-sgp-readiness-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_nfl_sgp_readiness.py' -v
      - run: python scripts/audit_nfl_sgp_readiness.py
