name: UFC Opponent Walkforward Research
on:
  pull_request:
  workflow_dispatch:
jobs:
  walkforward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_ufc_opponent_walkforward.py -v
      - run: python -m scripts.ufc_opponent_walkforward --output ufc_opponent_walkforward_report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ufc-opponent-walkforward-research
          path: ufc_opponent_walkforward_report.json
