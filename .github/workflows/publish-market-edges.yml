name: Publish Four-Sport Market Edges
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
concurrency:
  group: publish-four-sport-market-edges
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run scanner validation
        run: python -m unittest discover -s tests -p 'test_market_edge_feed.py' -v
      - name: Audit existing sport feeds and model/odds candidate readiness
        run: python -m scripts.market_edge_readiness
      - name: Test exact-contract model and sportsbook join
        run: python -m unittest tests.test_verified_market_join -v
      - name: Normalize verified upstream records only
        shell: bash
        run: |
          if [ -f data/verified_model_markets.json ] && [ -f data/verified_sportsbook_quotes.json ]; then
            python -m scripts.join_verified_markets
          else
            echo 'Verified independent model markets and sportsbook quotes must both exist; fail closed.'
            mkdir -p data
            printf '{"edges":[],"status":"UNAVAILABLE","reason":"Verified independent model markets or sportsbook quotes not connected"}\n' > data/market_edges.json
          fi
      - name: Publish feed only if changed
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market_edges.json data/market_edge_readiness.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified homepage market edges'
            git push
          fi
