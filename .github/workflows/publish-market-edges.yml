name: Publish Four-Sport Market Edges
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_ncaab_ml_predictions.py'
      - 'home_best_moneyline_parlay.js'
      - '.github/workflows/publish-market-edges.yml'
  workflow_dispatch:
  workflow_run:
    workflows:
      - Refresh NBA sportsbook odds
      - Automated NBA ML odds and research refresh
      - Refresh public odds snapshot
    types: [completed]
  schedule:
    - cron: '25 20,22 * * *' # safety fallback, not 15-minute polling
permissions:
  contents: write
concurrency:
  group: publish-four-sport-market-edges
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch all four sports in the same batch (manual and scheduled runs)
        if: ${{ github.event_name != 'workflow_run' }}
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        shell: bash
        run: |
          mkdir -p data
          : > data/market_refresh_results.txt
          for sport in basketball_nba icehockey_nhl americanfootball_nfl basketball_ncaab; do
            echo "::group::Fetch $sport"
            if ODDS_SPORT="$sport" ODDS_MARKETS=h2h python scripts/fetch_odds.py; then
              echo "$sport FRESH" >> data/market_refresh_results.txt
              if [ "$sport" = basketball_nba ]; then
                python scripts/build_nba_ml_predictions.py
                python scripts/refresh_nba_ml_research_audit.py
              elif [ "$sport" = icehockey_nhl ]; then
                python scripts/build_nhl_goal_rates.py || echo "NHL independent model research unavailable"
                python scripts/build_nhl_ml_predictions.py
              elif [ "$sport" = basketball_ncaab ]; then
                python scripts/build_ncaab_ml_predictions.py
              fi
            else
              echo "$sport UNAVAILABLE" >> data/market_refresh_results.txt
            fi
            echo "::endgroup::"
          done
          cat data/market_refresh_results.txt
      - name: Materialize independent model-market input contract without false certification
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/verified_model_markets.json')
          if not p.exists():
              p.write_text(json.dumps({'status':'UNAVAILABLE','markets':[],'reason':'No independently certified lineup and simulation records; research-only forecasts excluded'},indent=2)+'\n')
          else:
              obj=json.loads(p.read_text())
              assert isinstance(obj,dict) and isinstance(obj.get('markets'),list), 'Invalid verified model market contract'
          PY
      - name: Validate homepage and NCAA research model syntax
        run: |
          node --check home_best_moneyline_parlay.js
          python -m py_compile scripts/build_ncaab_ml_predictions.py
      - name: Run scanner validation
        run: python -m unittest discover -s tests -p 'test_market_edge_feed.py' -v
      - name: Audit four-sport odds coverage
        run: python -m scripts.four_sport_odds_coverage
      - name: Normalize sportsbook quotes from existing snapshots
        run: python -m scripts.normalize_sportsbook_quotes
      - name: Audit existing sport feeds and model/odds candidate readiness
        run: python -m scripts.market_edge_readiness
      - name: Test exact-contract model and sportsbook join
        run: python -m unittest discover -s tests -p 'test_verified_market_join.py' -v
      - name: Test quote normalization and coverage
        run: |
          python -m unittest discover -s tests -p 'test_normalize_sportsbook_quotes.py' -v
          python -m unittest discover -s tests -p 'test_four_sport_odds_coverage.py' -v
      - name: Normalize verified upstream records only
        shell: bash
        run: |
          python -m scripts.join_verified_markets
      - name: Publish feed only if changed
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market_edges.json data/verified_model_markets.json data/market_edge_readiness.json data/verified_sportsbook_quotes.json data/four_sport_odds_coverage.json
          if [ -f data/market_refresh_results.txt ]; then git add data/market_refresh_results.txt; fi
          git add feed/basketball_nba.json feed/icehockey_nhl.json feed/americanfootball_nfl.json feed/basketball_ncaab.json feed/nba_ml_predictions.json feed/nba_ml_simulation_audit.json feed/nhl_ml_predictions.json feed/nhl_expected_goals.json feed/nhl_model_backtest.json feed/ncaab_ml_predictions.json feed/latest.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified homepage market edges'
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            echo 'Publish failed after five concurrent-write retries' >&2
            exit 1
          fi
