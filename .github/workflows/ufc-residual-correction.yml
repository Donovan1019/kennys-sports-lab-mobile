name: UFC Market Residual Correction
on:
  pull_request:
  workflow_dispatch:
jobs:
  correction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_ufc_residual_correction.py -v
      - run: python -m scripts.ufc_residual_correction
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ufc-market-residual-correction
          path: ufc_residual_correction.json
