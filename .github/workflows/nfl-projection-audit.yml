name: NFL Projection Bias Audit
on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_nfl_projections.py'
      - 'feed/nfl_player_stats.json'
      - '.github/workflows/nfl-projection-audit.yml'
      - 'scripts/test_nfl_research_bridge.cjs'
      - 'scripts/audit_nfl_prop_calibration.cjs'
      - 'scripts/bridge_nfl_research.cjs'
      - 'scripts/audit_nfl_market_vs_model.cjs'
      - 'feed/americanfootball_nfl_forecast_ledger.json'
      - 'feed/americanfootball_nfl_market_baseline_ledger.json'
      - 'feed/americanfootball_nfl_forecast_outcomes.json'
  pull_request:
    paths:
      - 'scripts/audit_nfl_projections.py'
      - '.github/workflows/nfl-projection-audit.yml'
  workflow_dispatch:
  schedule:
    - cron: '35 13 * * *'
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify NFL research bridge safety
        run: node scripts/test_nfl_research_bridge.cjs
      - name: Audit NFL forecast skill against sportsbook consensus
        run: node scripts/audit_nfl_market_vs_model.cjs
      - name: Walk-forward NFL baseline audit
        run: python scripts/audit_nfl_projections.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nfl-projection-bias-audit
          path: |
            reports/nfl_projection_audit.json
            reports/nfl_market_accuracy.json
          if-no-files-found: warn
