name: NFL Projection Bias Audit
on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_nfl_projections.py'
      - 'feed/nfl_player_stats.json'
      - '.github/workflows/nfl-projection-audit.yml'
      - 'scripts/test_nfl_research_bridge.cjs'
      - 'scripts/audit_nfl_prop_calibration.cjs'
      - 'scripts/report_nfl_prop_readiness.cjs'
      - 'scripts/verify_nfl_prop_feed_contract.cjs'
      - 'scripts/archive_nfl_prop_forecasts.cjs'
      - 'scripts/test_nfl_prop_archive.cjs'
      - 'scripts/bridge_nfl_research.cjs'
      - 'scripts/audit_nfl_market_vs_model.cjs'
      - 'feed/americanfootball_nfl_forecast_ledger.json'
      - 'feed/americanfootball_nfl_market_baseline_ledger.json'
      - 'feed/americanfootball_nfl_forecast_outcomes.json'
  pull_request:
    paths:
      - 'scripts/audit_nfl_projections.py'
      - '.github/workflows/nfl-projection-audit.yml'
  workflow_dispatch:
  schedule:
    - cron: '35 13 * * *'
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify NFL research bridge safety
        run: node scripts/test_nfl_research_bridge.cjs
      - name: Verify immutable NFL prop archive safety
        run: node scripts/test_nfl_prop_archive.cjs
      - name: Check exact NFL player prop feed contract
        run: node scripts/verify_nfl_prop_feed_contract.cjs
      - name: Inventory independently graded NFL player prop evidence
        run: node scripts/report_nfl_prop_readiness.cjs
      - name: Audit NFL forecast skill against sportsbook consensus
        run: node scripts/audit_nfl_market_vs_model.cjs
      - name: Walk-forward NFL baseline audit
        run: python scripts/audit_nfl_projections.py
      - name: Publish dashboard accuracy data
        run: |
          cp reports/nfl_market_accuracy.json feed/nfl_market_accuracy.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feed/nfl_market_accuracy.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update NFL accuracy evidence'
            for attempt in 1 2 3 4; do
              git fetch origin main
              git rebase -X theirs origin/main || { git rebase --abort || true; exit 1; }
              if git push origin HEAD:main; then exit 0; fi
              echo "Concurrent update during publish attempt $attempt; retrying"
              sleep 2
            done
            echo 'Unable to publish accuracy snapshot after retries'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nfl-projection-bias-audit
          path: |
            reports/nfl_projection_audit.json
            reports/nfl_market_accuracy.json
            reports/nfl_prop_readiness.json
            reports/nfl_prop_feed_contract.json
          if-no-files-found: warn
