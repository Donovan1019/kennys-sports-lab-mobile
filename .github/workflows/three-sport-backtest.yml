name: Three-sport backtest audit
on:
  schedule:
    - cron: '15 16,22 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: three-sport-backtest-main
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Capture immutable sportsbook and model snapshots
        run: python scripts/three_sport_backtest.py capture
      - name: Collect completed games from ESPN for today and yesterday
        run: |
          python scripts/three_sport_results.py --date "$(date -u +%F)"
          python scripts/three_sport_results.py --date "$(date -u -d yesterday +%F)"
      - name: Generate yesterday and today UTC audits
        run: |
          python scripts/three_sport_backtest.py grade --date "$(date -u -d yesterday +%F)"
          python scripts/three_sport_backtest.py grade --date "$(date -u +%F)"
      - name: Commit append-only snapshots and reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backtests/snapshots backtests/reports backtests/results
          if ! git diff --cached --quiet; then
            git commit -m "audit: archive three-sport pregame snapshots and backtest status"
            git push
          fi
