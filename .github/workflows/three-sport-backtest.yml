name: Three-sport backtest audit
on:
  schedule:
    - cron: '15 12,16,22 * * *'
    - cron: '15 14,18,20 * * 0'
  push:
    branches: [main]
    paths:
      - 'scripts/three_sport_backtest.py'
      - 'tests/test_three_sport_quote_freshness.py'
      - '.github/workflows/three-sport-backtest.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: three-sport-backtest-main
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify stale sportsbook quote rejection
        run: python -m unittest discover -s tests -p test_three_sport_quote_freshness.py -v
      - name: Refresh cached NHL scoring history from public results
        run: python scripts/nhl_team_history.py
      - name: Generate pregame baseline forecasts locally (no API requests)
        run: python scripts/export_three_sport_predictions.py
      - name: Capture immutable sportsbook and model snapshots
        run: python scripts/three_sport_backtest.py capture
      - name: Collect completed games from ESPN for today and yesterday
        run: |
          python scripts/three_sport_results.py --date "$(date -u +%F)"
          python scripts/three_sport_results.py --date "$(date -u -d yesterday +%F)"
      - name: Generate yesterday and today UTC audits
        run: |
          python scripts/three_sport_backtest.py grade --date "$(date -u -d yesterday +%F)"
          python scripts/three_sport_backtest.py grade --date "$(date -u +%F)"
      - name: Commit append-only snapshots and reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backtests/snapshots backtests/reports backtests/results
          git add feed/nfl_model_predictions.json feed/nba_model_predictions.json feed/nhl_model_predictions.json
          if ! git diff --cached --quiet; then
            git commit -m "audit: archive three-sport pregame snapshots and backtest status"
            git push
          fi
