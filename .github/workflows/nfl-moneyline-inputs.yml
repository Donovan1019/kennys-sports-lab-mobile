name: Refresh NFL Moneyline Inputs
on:
  workflow_dispatch:
  schedule:
    - cron: '15 11 * * *'
permissions:
  contents: write
concurrency:
  group: nfl-moneyline-inputs
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh schedule and completed scoring history
        run: python scripts/refresh_nfl_moneyline_inputs.py
      - name: Archive pre-kickoff input snapshot\n        run: python scripts/archive_nfl_moneyline_snapshots.py inputs\n      - name: Commit only validated source updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/independent_game_inputs.json
          if [ -d archive/nfl_moneyline/inputs ]; then git add archive/nfl_moneyline/inputs/; fi
          if ! git diff --cached --quiet; then
            git commit -m "Refresh NFL Moneyline independent schedule and scoring inputs"
            git push
          fi
