name: Existing NFL Data Reuse Audit
on:
  pull_request:
    paths:
      - 'scripts/audit_existing_nfl_data.py'
      - 'scripts/test_existing_nfl_data_audit.py'
      - '.github/workflows/nfl-existing-data-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate NFL feed audit
        run: python -m unittest scripts/test_existing_nfl_data_audit.py
      - name: Inventory existing NFL datasets
        run: python scripts/audit_existing_nfl_data.py
