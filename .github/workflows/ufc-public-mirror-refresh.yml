name: Refresh UFC Public Fighter Stats
on:
  schedule:
    - cron: '15 15 * * *'
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'ufc_mirror_stats.js'
      - 'scripts/ufc_public_mirror_ingest.py'
permissions:
  contents: write
concurrency:
  group: ufc-public-mirror-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run parser tests
        run: python -m unittest discover -s tests -p test_ufc_public_mirror_ingest.py -v
      - name: Refresh public fighter research
        run: python scripts/ufc_public_mirror_ingest.py
      - name: Validate source match coverage
        run: |
          python - <<'PY'
          import json
          r=json.load(open('feed/ufc_fighter_stats_mirror.json'))
          n=sum(x['status']=='MATCHED_HISTORICAL_STATS' for x in r['fighters'])
          print('Matched historical profiles:',n,'/',len(r['fighters']))
          assert r['bet_eligible'] is False
          assert n>=1, 'No matching historical profiles; do not publish empty dataset'
          PY
      - name: Commit updated research feed
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/ufc_fighter_stats_mirror.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh UFC public historical fighter statistics [skip ci]"
            git push
          fi
