name: UFC Historical Elo Research Backtest
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-elo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download public historical UFCStats CSVs
        run: |
          mkdir -p /tmp/ufc-history
          curl --fail --location --retry 3 --max-time 120 --output /tmp/ufc-history/events.csv https://raw.githubusercontent.com/Greco1899/scrape_ufc_stats/main/ufc_event_details.csv
          curl --fail --location --retry 3 --max-time 120 --output /tmp/ufc-history/fights.csv https://raw.githubusercontent.com/Greco1899/scrape_ufc_stats/main/ufc_fight_results.csv
          test -s /tmp/ufc-history/events.csv
          test -s /tmp/ufc-history/fights.csv
          curl --fail --location --retry 3 --max-time 120 --output /tmp/ufc-history/fight_stats.csv https://raw.githubusercontent.com/Greco1899/scrape_ufc_stats/main/ufc_fight_stats.csv
          test -s /tmp/ufc-history/fight_stats.csv
          sha256sum /tmp/ufc-history/events.csv /tmp/ufc-history/fights.csv /tmp/ufc-history/fight_stats.csv | tee /tmp/ufc-history/source_sha256.txt
      - name: Audit fighter-level historical stats feed
        run: |
          python scripts/ufc_historical_stats_audit.py --input /tmp/ufc-history/fight_stats.csv --output /tmp/ufc-history/fight_stats_audit.json
      - name: Import and evaluate real historical fights
        run: |
          python scripts/ufc_import_historical_csv.py --events /tmp/ufc-history/events.csv --fights /tmp/ufc-history/fights.csv --output /tmp/ufc-history/verified_bouts.json
          python scripts/ufc_elo_baseline.py --input /tmp/ufc-history/verified_bouts.json --output /tmp/ufc-history/elo_report.json --minimum-evaluated 1
      - name: Publish chronological calibration audit to workflow summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report=json.loads(Path('/tmp/ufc-history/elo_report.json').read_text())
          audit=report['calibration_audit']
          inactivity=report['inactivity_audit']
          walk_forward=report['inactivity_walk_forward']
          feature_readiness=report['fighter_feature_readiness']
          fields=[
              ('Calibration status',audit['status']),
              ('Training fights',audit['fit_count']),
              ('Holdout fights',audit['holdout_count']),
              ('Selected shrinkage',audit['selected_shrinkage']),
              ('Raw holdout Brier',report['holdout_brier']),
              ('Calibrated holdout Brier',audit['holdout_brier']),
              ('Brier delta (negative is better)',audit['delta_brier_vs_raw']),
              ('Raw holdout log loss',report['holdout_log_loss']),
              ('Calibrated holdout log loss',audit['holdout_log_loss']),
              ('Log-loss delta (negative is better)',audit['delta_log_loss_vs_raw']),
              ('Inactivity training coverage',inactivity['train_available']),
              ('Inactivity holdout coverage',inactivity['holdout_available']),
              ('Inactivity coefficient',inactivity['selected_coefficient']),
              ('Inactivity holdout Brier delta',inactivity['delta_brier']),
              ('Inactivity holdout log-loss delta',inactivity['delta_log_loss']),
          ]
          summary='## UFC Elo chronological calibration (research only)\\n\\n| Metric | Value |\\n|---|---|\\n'
          summary+=''.join(f'| {name} | {value} |\\n' for name,value in fields)
          summary+='\\nNot sportsbook-verified; not betting certified.\\n'
          summary+='\\n## Expanding-window inactivity checks\\n\\n| Train | Test | Coefficient | Brier delta | Log-loss delta |\\n|---:|---:|---:|---:|---:|\\n'
          summary+=''.join(f"| {w['train_count']} | {w['test_count']} | {w['selected_coefficient']} | {w['delta_brier']:.6f} | {w['delta_log_loss']:.6f} |\\n" for w in walk_forward['windows'])
          summary+='\\n## Fighter-stat feature readiness\\n\\n'
          summary+=f"Status: **{feature_readiness['status']}**\\n\\n"
          summary+='Unavailable: '+', '.join(feature_readiness['unavailable'])+'\\n\\n'
          summary+='No fabricated striking or grappling predictions.\\n'
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as output:
              output.write(summary)
          print(json.dumps({'calibration_audit':audit,'raw_holdout_brier':report['holdout_brier'],
                            'raw_holdout_log_loss':report['holdout_log_loss'], 'inactivity_audit':inactivity,'inactivity_walk_forward':walk_forward,'fighter_feature_readiness':feature_readiness}))
          PY
      - name: Download and audit free historical odds candidates
        run: |
          curl --fail --location --retry 3 --max-time 120 --output /tmp/ufc-history/historical_odds.csv https://raw.githubusercontent.com/jansen88/ufc-data/master/data/complete_ufc_data.csv
          test -s /tmp/ufc-history/historical_odds.csv
          sha256sum /tmp/ufc-history/historical_odds.csv | tee -a /tmp/ufc-history/source_sha256.txt
          python scripts/ufc_historical_odds_candidates.py --input /tmp/ufc-history/historical_odds.csv --output /tmp/ufc-history/odds_candidates.json
      - name: Cross-match retrospective historical odds and Elo holdout
        run: |
          python scripts/ufc_match_historical_odds.py --bouts /tmp/ufc-history/verified_bouts.json --odds /tmp/ufc-history/odds_candidates.json --elo-report /tmp/ufc-history/elo_report.json --output /tmp/ufc-history/retrospective_market_comparison.json
      - name: Produce fail-closed betting certification verdict
        if: always()
        run: |
          if test -s /tmp/ufc-history/elo_report.json; then
            python scripts/ufc_betting_certification.py --report /tmp/ufc-history/elo_report.json --output /tmp/ufc-history/betting_certification.json || test -s /tmp/ufc-history/betting_certification.json
          fi
      - name: Archive research results (never auto-publish as betting picks)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ufc-historical-elo-research
          path: |
            /tmp/ufc-history/source_sha256.txt
            /tmp/ufc-history/verified_bouts.json
            /tmp/ufc-history/fight_stats_audit.json
            /tmp/ufc-history/elo_report.json
            /tmp/ufc-history/odds_candidates.json
            /tmp/ufc-history/retrospective_market_comparison.json
            /tmp/ufc-history/betting_certification.json
          if-no-files-found: warn
          retention-days: 30
