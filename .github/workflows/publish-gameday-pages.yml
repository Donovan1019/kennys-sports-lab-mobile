name: Publish Kenny's Sports Lab to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check published entrypoints
        run: |
          test -s index.html
          test -s nfl.html
          test -s gameday.html
          test -s nfl_matchup_advanced.js
          test -s nfl_prediction_engine.js
      - name: Validate NFL GameDay data and prediction pipeline
        run: |
          node scripts/audit_nfl_defensive_feed.cjs
          python3 scripts/test_nfl_defensive_boxscore.py
          python3 scripts/test_nfl_defensive_matchup_feed.py
          node scripts/test_nfl_prediction_lab.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published GameDay URL
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          for path in index.html nfl.html gameday.html nfl_matchup_advanced.js nfl_prediction_engine.js; do
            url="$base/$path"
            echo "Checking $url"
            curl --fail --location --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 --output /dev/null "$url"
          done
