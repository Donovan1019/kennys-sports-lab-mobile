name: Market Math Tests
on:
  workflow_dispatch:
  push:
    paths:
      - 'three_sport_*.js'
      - 'matchup_market_audit.js'
      - 'tests/three_sport_research.test.cjs'
      - '.github/workflows/market-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check syntax
        run: python -m py_compile scripts/market_math.py
      - name: Run market calculation tests
        run: python -m unittest discover -s tests -v
      - name: Validate three-sport JavaScript syntax
        run: |
          node --check three_sport_bet_readiness.js
          node --check three_sport_probability_research.js
          node --check matchup_market_audit.js
          node --check three_sport_market_health.js
      - name: Run three-sport research regression tests
        run: node tests/three_sport_research.test.cjs
