name: UFC Walkforward Score Validation
on:
  pull_request:
  workflow_dispatch:
jobs:
  walkforward-score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_ufc_walkforward_score.py' -v
