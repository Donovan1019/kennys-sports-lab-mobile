name: Refresh NFL Player Stats
on:
  schedule:
    - cron: '20 12 * * 1,4,6'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_nfl_stats.py'
      - '.github/workflows/refresh-nfl-stats.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate free NFL player stats parser
        run: python scripts/test_fetch_nfl_stats.py
      - name: Fetch public nflverse weekly player stats
        run: python scripts/fetch_nfl_stats.py
      - name: Commit verified snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/nfl_player_stats.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified NFL player game logs"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
