name: Refresh NFL Player Stats
on:
  schedule:
    - cron: '20 12 * * 1,4,6'
    - cron: '15 16,20 * * 0'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_nfl_stats.py'
      - 'scripts/test_fetch_nfl_stats.py'
      - 'scripts/test_nfl_sgp_joint.cjs'
      - '.github/workflows/refresh-nfl-stats.yml'
permissions:
  contents: write
concurrency:
  group: nfl-player-stats-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate free NFL player stats parser
        run: |
          python -m py_compile scripts/fetch_nfl_stats.py
          python scripts/test_fetch_nfl_stats.py
      - name: Validate existing NFL SGP joint simulator
        run: node scripts/test_nfl_sgp_joint.cjs
      - name: Fetch public nflverse weekly player stats
        run: python scripts/fetch_nfl_stats.py
      - name: Verify generated player snapshot is usable
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("feed/nfl_player_stats.json")
          if not p.is_file() or p.stat().st_size<100:
              raise SystemExit("NFL player snapshot missing or empty after refresh")
          d=json.loads(p.read_text())
          players=d.get("players",[])
          current=[x for x in players if x.get("position") in ("QB","RB","WR","TE") and any(g.get("season")==2026 and g.get("season_type")=="REG" for g in x.get("games",[]))]
          print("NFL player feed:",len(players),"players,",len(current),"current-season skill players")
          from collections import Counter
          ids=Counter(g["game_id"] for p in players for g in p.get("games",[]) if g.get("season")==2026 and g.get("season_type")=="REG" and g.get("game_id"))
          paired=sum(n>=2 for n in ids.values())
          print("NFL same-event simulation coverage:",len(ids),"unique game IDs;",paired,"games with 2+ player records")
          if paired<5:
              print("WARNING: insufficient real shared game IDs for same-event historical bootstrap; research simulations remain BLOCKED")

          if d.get("source")!="nflverse-stats-player-week" or not current:
              raise SystemExit("NFL player feed failed current-season verification")
          PY
      - name: Commit verified snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/nfl_player_stats.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified NFL player game logs"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
