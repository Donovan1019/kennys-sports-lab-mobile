name: Refresh NFL Player Stats
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public nflverse weekly player stats
        run: python scripts/fetch_nfl_stats.py
      - name: Commit verified snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/nfl_player_stats.json
          git diff --cached --quiet || (git commit -m "Refresh verified NFL player game logs" && git push)
