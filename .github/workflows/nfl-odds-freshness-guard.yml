name: NFL Odds Freshness Guard
on:
  pull_request:
    paths:
      - 'scripts/fetch_odds.py'
      - 'scripts/test_nfl_odds_freshness.py'
      - '.github/workflows/nfl-odds-freshness-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freshness-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test NFL odds response validation
        run: python -m unittest scripts/test_nfl_odds_freshness.py
