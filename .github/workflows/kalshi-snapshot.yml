name: Kalshi public market snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: write
concurrency:
  group: kalshi-public-snapshot
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch read-only public sports quotes
        run: python scripts/collect_kalshi.py
      - name: Commit fresh snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/kalshi-markets.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh Kalshi public sports snapshot'
            git push
          fi
