name: Kalshi public market snapshot
on:
  push:
    branches: [main]
    paths:
      - 'scripts/collect_kalshi.py'
      - 'scripts/archive_kalshi_forecasts.py'
      - 'scripts/collect_kalshi_game_results.py'
      - 'scripts/collect_kalshi_settlements.py'
      - 'scripts/join_kalshi_settlements.py'
      - 'scripts/audit_kalshi_integrity.py'
      - 'scripts/build_kalshi_advanced_picks.py'
      - 'scripts/test_kalshi_advanced_picks.py'
      - '.github/workflows/kalshi-snapshot.yml'
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: write
concurrency:
  group: kalshi-public-snapshot
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch read-only public sports quotes
        id: market_fetch
        continue-on-error: true
        run: python scripts/collect_kalshi.py
      - name: Archive pregame model forecasts (append only)
        run: python scripts/archive_kalshi_forecasts.py
      - name: Match completed games to independent ESPN final scores
        id: score_fetch
        continue-on-error: true
        run: python scripts/collect_kalshi_game_results.py
      - name: Collect actual Kalshi settled contract outcomes
        id: settlement_fetch
        continue-on-error: true
        run: python scripts/collect_kalshi_settlements.py
      - name: Join independently verified settlements to archived forecasts
        id: settlement_join
        continue-on-error: true
        run: python scripts/join_kalshi_settlements.py
      - name: Audit calibration, settlement and fees (fail closed)
        run: python scripts/audit_kalshi_integrity.py
      - name: Validate Kalshi team identity and pricing regression checks
        run: python -m unittest scripts.test_kalshi_advanced_picks
      - name: Generate evidence-checked advanced picks feed
        run: python scripts/build_kalshi_advanced_picks.py
      - name: Show generated data and enforce output contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('kalshi-markets.json','kalshi-integrity.json','kalshi-pregame-forecasts.json','kalshi-settlements.json','kalshi-advanced-picks.json'):
              p=Path('data')/name
              assert p.exists(), f'Missing required output: {p}'
              data=json.loads(p.read_text())
              print(f'{p}: {p.stat().st_size} bytes, fields={list(data)[:8]}')
          PY
      - name: Commit fresh snapshot and audit evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/kalshi-markets.json data/kalshi-integrity.json data/kalshi-pregame-forecasts.json data/kalshi-settlements.json data/kalshi-advanced-picks.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh Kalshi public sports snapshot'
            for attempt in 1 2 3 4; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                echo 'Kalshi snapshot published successfully'
                exit 0
              fi
              git rebase --abort || true
              sleep $((attempt * 3))
            done
            echo 'Kalshi snapshot publication failed after four attempts' >&2
            exit 1
          fi
