name: Kalshi public market snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: write
concurrency:
  group: kalshi-public-snapshot
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch read-only public sports quotes
        run: python scripts/collect_kalshi.py
      - name: Archive pregame model forecasts (append only)
        run: python scripts/archive_kalshi_forecasts.py
      - name: Match completed games to independent ESPN final scores
        run: python scripts/collect_kalshi_game_results.py
      - name: Collect actual Kalshi settled contract outcomes
        run: python scripts/collect_kalshi_settlements.py
      - name: Join independently verified settlements to archived forecasts
        run: python scripts/join_kalshi_settlements.py
      - name: Audit calibration, settlement and fees (fail closed)
        run: python scripts/audit_kalshi_integrity.py
      - name: Show generated data and enforce output contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('kalshi-markets.json','kalshi-integrity.json','kalshi-pregame-forecasts.json','kalshi-settlements.json'):
              p=Path('data')/name
              assert p.exists(), f'Missing required output: {p}'
              data=json.loads(p.read_text())
              print(f'{p}: {p.stat().st_size} bytes, fields={list(data)[:8]}')
          PY
      - name: Commit fresh snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/kalshi-markets.json data/kalshi-integrity.json data/kalshi-pregame-forecasts.json data/kalshi-settlements.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh Kalshi public sports snapshot'
            git push
          fi
