name: Automated NBA ML odds and research refresh
on:
  schedule:
    - cron: '20 15,20 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nba-ml-automated-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate NBA refresh Python syntax before consuming API credits
        run: python -m py_compile scripts/fetch_odds.py scripts/build_nba_ml_predictions.py scripts/refresh_nba_ml_research_audit.py
      - name: Fetch current NBA sportsbook prices
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          ODDS_SPORT: basketball_nba
          ODDS_MARKETS: h2h
        run: python scripts/fetch_odds.py
      - name: Build matching independent model and research simulations
        run: |
          python scripts/build_nba_ml_predictions.py
          python scripts/refresh_nba_ml_research_audit.py
      - name: Publish NBA snapshot atomically
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/basketball_nba.json feed/nba_ml_predictions.json feed/nba_ml_simulation_audit.json feed/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh NBA odds and model research together"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            echo 'Publish failed after five concurrent-write retries' >&2
            exit 1
          fi
