name: PropLine NFL private validation
on:
  schedule:
    - cron: '0 15,20 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/propline-nfl-private.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate NFL provider without publishing raw data
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, json, os, sys
          key=os.environ.get("PROPLINE_API_KEY")
          if not key: sys.exit("Missing provider secret")
          markets="player_pass_yds,player_pass_tds,player_rush_yds,player_reception_yds,player_receptions,player_anytime_td"
          url="https://api.prop-line.com/v1/sports/football_nfl/odds?"+urllib.parse.urlencode({"apiKey":key,"markets":markets,"bookmakers":"draftkings,fanduel","oddsFormat":"american"})
          try:
              with urllib.request.urlopen(url,timeout=40) as r:
                  data=json.load(r)
          except Exception as e:
              sys.exit("Provider request failed: "+type(e).__name__+" "+str(getattr(e,"code","")))
          if not isinstance(data,list): sys.exit("Unexpected response schema")
          counts={}
          for event in data:
              for book in event.get("bookmakers",[]):
                  if book.get("key") not in ("draftkings","fanduel"): continue
                  for market in book.get("markets",[]):
                      if market.get("key") not in markets.split(","): continue
                      k=book["key"]+"/"+market["key"]
                      counts[k]=counts.get(k,0)+len(market.get("outcomes",[]))
          print("Events:",len(data),"Market coverage:",json.dumps(counts))
          if not any(counts.values()): sys.exit("No supported player props")
          from scripts.fetch_nfl_props import eligible_events, extract, MARKETS, BOOKS, SPORT
          from datetime import datetime, timezone
          from pathlib import Path
          now=datetime.now(timezone.utc)
          events=eligible_events(data,now)
          rows=[]
          for event in events:
              for row in extract(event,event):
                  try:
                      ts=datetime.fromisoformat(row["updated_at"].replace("Z","+00:00"))
                      if 0 <= (now-ts).total_seconds() <= 3600: rows.append(row)
                  except (ValueError,TypeError,AttributeError): pass
          if not rows: sys.exit("No fresh upcoming player props")
          schedule=[{"event_id":e["id"],"event":e["away_team"]+" @ "+e["home_team"],"commence_time":e["commence_time"]} for e in events]
          Path("feed/nfl_props.json").write_text(json.dumps({"source":"propline","sport":SPORT,"fetched_at":now.isoformat(),"markets_requested":list(MARKETS),"books":list(BOOKS),"schedule_games":schedule,"odds":rows}))
          print("Fresh normalized selections:",len(rows))
          PY
      - name: Run existing NFL projection engine privately
        run: node scripts/export_nfl_prop_forecasts.cjs
      - name: Audit existing NFL SGP research
        run: node scripts/audit_nfl_sgp_research.cjs
