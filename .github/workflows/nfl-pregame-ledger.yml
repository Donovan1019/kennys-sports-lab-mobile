name: NFL Pregame Ledger Integrity and Grading
on:
  push:
    branches: [main]
    paths:
      - 'scripts/validate_nfl_pregame_ledger.py'
      - 'scripts/grade_nfl_pregame_ledger.py'
      - 'tests/test_nfl_pregame_ledger.py'
      - 'tests/test_nfl_pregame_grading.py'
      - 'scripts/bridge_nfl_existing_prop_feeds.py'
      - 'scripts/report_nfl_pregame_ledger.py'
      - 'scripts/diagnose_nfl_rush_grading.py'
      - 'tests/test_nfl_existing_feed_bridge.py'
      - 'tests/test_nfl_ledger_dashboard.py'
      - 'tests/test_nfl_grading_independence.py'
      - 'feed/nfl_prop_forecast_ledger.json'
      - 'feed/nfl_prop_verified_outcomes.json'
      - 'feed/nfl_pregame_snapshots.json'
      - 'feed/nfl_settled_player_results.json'
      - '.github/workflows/nfl-pregame-ledger.yml'
  workflow_dispatch:
  schedule:
    - cron: '50 12 * * *'
permissions:
  contents: read
jobs:
  validate-and-grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test snapshot and grading integrity
        run: |
          python -m unittest discover -s tests -p test_nfl_pregame_ledger.py -v
          python -m unittest discover -s tests -p test_nfl_pregame_grading.py -v
          python -m unittest discover -s tests -p test_nfl_existing_feed_bridge.py -v
          python -m unittest discover -s tests -p test_nfl_ledger_dashboard.py -v
          python -m unittest discover -s tests -p test_nfl_grading_independence.py -v
      - name: Grade only when both input feeds exist
        shell: bash
        run: |
          if [[ -f feed/nfl_pregame_snapshots.json && -f feed/nfl_settled_player_results.json ]]; then
            python -m scripts.grade_nfl_pregame_ledger feed/nfl_pregame_snapshots.json feed/nfl_settled_player_results.json > nfl_pregame_ledger_report.json\n            cat nfl_pregame_ledger_report.json
          else
            echo '{"status":"BLOCKED","reason":"Real pregame snapshots and/or settled player results are not supplied","bet_eligibility":"BLOCKED"}' > nfl_pregame_ledger_report.json
            cat nfl_pregame_ledger_report.json
          fi
      - name: Grade existing archived sportsbook forecasts against ESPN outcomes
        shell: bash
        run: |
          if [[ -f feed/nfl_prop_forecast_ledger.json && -f feed/nfl_prop_verified_outcomes.json ]]; then
            python -m scripts.report_nfl_pregame_ledger > nfl_pregame_market_dashboard.json
            cat nfl_pregame_market_dashboard.json
            python -m scripts.diagnose_nfl_rush_grading > nfl_rush_grading_diagnostics.json
          else
            echo '{"status":"BLOCKED","reason":"Archived forecasts or verified outcomes missing","bet_eligibility":"BLOCKED"}' > nfl_pregame_market_dashboard.json
          fi
      - name: Publish explicit evidence status
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path("nfl_pregame_ledger_report.json")
          raw=json.loads(p.read_text()) if p.exists() else {"status":"BLOCKED"}
          q=Path("nfl_pregame_market_dashboard.json")
          archive=json.loads(q.read_text()) if q.exists() else {"status":"BLOCKED"}
          coverage=archive.get("coverage",{})
          markets=archive.get("markets",{})
          lines=["## NFL pregame evidence (two distinct pipelines)","",
                 f"- Direct pregame feed: **{raw.get('status','BLOCKED')}** (graded {raw.get('graded',0)}; pending {raw.get('pending',0)})",
                 f"- Archived sportsbook forecast grading: **{archive.get('status','BLOCKED')}**",
                 f"- Archived graded sides: **{archive.get('total_graded_sides',0)}** (over/under pairs; not independent wagers)",
                 f"- Archived pending sides: **{archive.get('total_pending_sides',0)}**",
                 f"- Archived forecast rows: **{coverage.get('forecast_rows',0)}**",
                 f"- ESPN verified outcome rows: **{coverage.get('verified_outcome_rows',0)}**",
                 f"- Unsupported market exclusions: **{coverage.get('excluded_unsupported_market_forecasts',0)}**",
                 "- Betting eligibility: **BLOCKED**",
                 "- Passing CI confirms execution, not live sportsbook authentication or betting readiness.",
                 "",
                 "| Market | Graded over forecasts | W-L | Brier | Hypothetical units |",
                 "|---|---:|---:|---:|---:|"]
          for market,data in sorted(markets.items()):
              lines.append(f"| {market} | {data.get('graded_over_forecasts',0)} | {data.get('wins',0)}-{data.get('losses',0)} | {data.get('brier')} | {data.get('hypothetical_units')} |")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as out:
              out.write("\\n".join(lines)+"\\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nfl-pregame-ledger-report
          path: |
            nfl_pregame_ledger_report.json
            nfl_pregame_market_dashboard.json
            nfl_rush_grading_diagnostics.json
