name: UFC Duration Uncertainty Audit
on:
  pull_request:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_ufc_duration_uncertainty.py -v
      - run: python -m scripts.ufc_duration_uncertainty --output backtests/reports/ufc_duration_uncertainty.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ufc-duration-uncertainty
          path: backtests/reports/ufc_duration_uncertainty.json
