name: Refresh UFC public fight card
on:
  schedule:
    - cron: '40 14 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ufc-public-card-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh free UFC card
        run: python scripts/ufc_event_ingest.py
      - name: Export research-only UFC simulation audit
        run: python scripts/ufc_monte_carlo.py
      - name: Incremental historical UFC backfill
        run: python scripts/ufc_automated_backfill.py
      - name: Update UFC historical research audits
        run: |
          python scripts/ufc_winner_history.py --input feed/ufc_historical_backfill.json --output feed/ufc_winner_history.json
          python scripts/ufc_elo_baseline.py --input feed/ufc_historical_backfill.json --output backtests/reports/ufc_elo_baseline.json
          python scripts/ufc_holdout_readiness.py --input feed/ufc_historical_backfill.json --output backtests/reports/ufc_holdout_readiness.json
      - name: Commit only changed UFC feed
        run: |
          if ! git diff --quiet -- feed/ufc_research.json feed/ufc_simulations.json feed/ufc_historical_backfill.json feed/ufc_winner_history.json backtests/reports/ufc_elo_baseline.json backtests/reports/ufc_holdout_readiness.json || [ ! -f feed/ufc_simulations.json ] || [ ! -f feed/ufc_historical_backfill.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add feed/ufc_research.json feed/ufc_simulations.json feed/ufc_historical_backfill.json feed/ufc_winner_history.json backtests/reports/ufc_elo_baseline.json backtests/reports/ufc_holdout_readiness.json
            git commit -m "Refresh UFC research fight card [skip ci]"
            git push
          fi
