name: Refresh UFC public fight card
on:
  schedule:
    - cron: '40 14 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ufc-public-card-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh free UFC card
        run: python scripts/ufc_event_ingest.py
      - name: Commit only changed UFC feed
        run: |
          if ! git diff --quiet -- feed/ufc_research.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add feed/ufc_research.json
            git commit -m "Refresh UFC research fight card [skip ci]"
            git push
          fi
