name: Refresh UFC public fight card
on:
  schedule:
    - cron: '40 14 * * *'
    - cron: '40 20 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ufc-public-card-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify UFC runtime module imports
        run: python -c 'import scripts.ufc_automated_backfill, scripts.ufc_historical_backfill, scripts.ufc_holdout_readiness, scripts.ufc_data_health'
      - name: Refresh free UFC card
        run: python scripts/ufc_event_ingest.py
      - name: Export research-only UFC simulation audit
        run: python scripts/ufc_monte_carlo.py
      - name: Incremental historical UFC backfill
        run: python -m scripts.ufc_automated_backfill
      - name: Update UFC historical research audits
        run: |
          python -m scripts.ufc_winner_history --input feed/ufc_historical_backfill.json --output feed/ufc_winner_history.json
          python -m scripts.ufc_elo_baseline --input feed/ufc_historical_backfill.json --output backtests/reports/ufc_elo_baseline.json
          python -m scripts.ufc_holdout_readiness --input feed/ufc_historical_backfill.json --output backtests/reports/ufc_holdout_readiness.json
      - name: Audit real historical data readiness
        run: python -m scripts.ufc_data_health
      - name: Refresh free historical Elo research snapshot and upcoming matchup projections
        run: |
          python scripts/ufc_tidytuesday_import.py --output feed/ufc_tidytuesday_research.json
          python -m scripts.ufc_elo_card_projections
      - name: Commit changed UFC research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/ufc_research.json feed/ufc_tidytuesday_research.json feed/ufc_elo_projections.json feed/ufc_simulations.json feed/ufc_historical_backfill.json feed/ufc_winner_history.json backtests/reports/ufc_elo_baseline.json backtests/reports/ufc_holdout_readiness.json backtests/reports/ufc_data_health.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh UFC research data [skip ci]"
            git push
          else
            echo "No UFC research changes to commit"
          fi
