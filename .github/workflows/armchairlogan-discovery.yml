name: ArmchairLogan forecast sync
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */4 * * *'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and validate forecasts
        run: |
          curl --fail --retry 3 --max-time 60 https://football.armchairlogan.workers.dev/api/state -o /tmp/armchair.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/armchair.json'))
          assert isinstance(d['games'],list) and d['games']
          assert any(isinstance(g.get('consensus',{}).get('away_score'),(int,float)) for g in d['games'])
          keys=['id','season','week','away','home','kickoff','consensus','away_final','home_final']
          out={'last_update':d['last_update'],'games':[{k:g.get(k) for k in keys} for g in d['games']]}
          json.dump(out,open('feed/armchairlogan_state.json','w'),indent=2)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Archive Kenny pregame projections
        run: node scripts/armchairlogan_archive.cjs
      - name: Collect injury and depth chart reports
        continue-on-error: true
        timeout-minutes: 10
        run: python scripts/armchairlogan_availability.py
      - name: Publish snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feed/armchairlogan_state.json feed/armchairlogan_kenny_archive.json feed/armchairlogan_availability.json
          git diff --cached --quiet || git commit -m 'Refresh ArmchairLogan published forecasts'
          git pull --rebase origin main
          git push origin HEAD:main
