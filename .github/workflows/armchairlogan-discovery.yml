name: ArmchairLogan forecast sync
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/armchairlogan_weather.py
      - scripts/armchairlogan_efficiency.py
      - .github/workflows/armchairlogan-discovery.yml
  schedule:
    - cron: '23 */4 * * *'
concurrency:
  group: armchairlogan-sync
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and validate forecasts
        run: |
          curl --fail --retry 3 --max-time 60 https://football.armchairlogan.workers.dev/api/state -o /tmp/armchair.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/armchair.json'))
          assert isinstance(d['games'],list) and d['games']
          assert any(isinstance(g.get('consensus',{}).get('away_score'),(int,float)) for g in d['games'])
          keys=['id','season','week','away','home','kickoff','consensus','away_final','home_final']
          out={'last_update':d['last_update'],'games':[{k:g.get(k) for k in keys} for g in d['games']]}
          json.dump(out,open('feed/armchairlogan_state.json','w'),indent=2)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Archive Kenny pregame projections
        run: node scripts/armchairlogan_archive.cjs
      - name: Collect injury and depth chart reports
        continue-on-error: true
        timeout-minutes: 10
        run: python scripts/armchairlogan_availability.py
      - name: Collect stadium weather forecasts
        continue-on-error: true
        timeout-minutes: 12
        run: python scripts/armchairlogan_weather.py
      - name: Collect advanced efficiency
        continue-on-error: true
        timeout-minutes: 8
        run: python scripts/armchairlogan_efficiency.py
      - name: Collect historical matchup results
        continue-on-error: true
        run: python scripts/armchairlogan_history.py
      - name: Publish snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feed/armchairlogan_state.json feed/armchairlogan_kenny_archive.json feed/armchairlogan_availability.json
          if test -f feed/armchairlogan_weather.json; then git add feed/armchairlogan_weather.json; fi
          if test -f feed/armchairlogan_efficiency.json; then git add feed/armchairlogan_efficiency.json; fi
          if test -f feed/armchairlogan_history.json; then git add feed/armchairlogan_history.json; fi
          git diff --cached --quiet || git commit -m 'Refresh ArmchairLogan published forecasts'
          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase -X ours origin main; then
              git rebase --abort || true
              sleep $((attempt * 3))
              continue
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
