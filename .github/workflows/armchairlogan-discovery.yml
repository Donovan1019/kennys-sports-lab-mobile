name: ArmchairLogan public forecast discovery
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */4 * * *'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Capture public forecast export
        run: node scripts/armchairlogan_discover.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: armchairlogan-discovery
          path: armchairlogan-discovery/
