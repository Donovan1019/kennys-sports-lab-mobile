name: OddsPapi Safe Connection Probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/oddspapi_connection_probe.js'
      - 'scripts/oddspapi_market_catalog.js'
      - 'tests/oddspapi_market_catalog.test.js'
      - 'tests/oddspapi_connection_probe.test.js'
      - '.github/workflows/oddspapi-connection-probe.yml'
  pull_request:
    paths:
      - 'scripts/oddspapi_connection_probe.js'
      - 'tests/oddspapi_connection_probe.test.js'
      - '.github/workflows/oddspapi-connection-probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/oddspapi_connection_probe.test.js && node tests/oddspapi_market_catalog.test.js
      - name: Verify OddsPapi secret using account endpoint
        if: github.event_name != 'pull_request'
        env:
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
        run: node scripts/oddspapi_connection_probe.js
