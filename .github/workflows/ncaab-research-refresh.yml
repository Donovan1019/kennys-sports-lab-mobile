name: NCAAB Research Diagnostics Refresh
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ncaab-research-refresh.yml'
      - 'scripts/ncaab_research_backtest.py'
      - 'data/ncaab_espn_history.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ncaab-espn-enrichment
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild point-in-time research audit
        run: python3 scripts/ncaab_research_backtest.py
      - name: Verify diagnostics schema
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('data/ncaab_research.json'))
          x=d['walk_forward']
          assert d['research_only'] is True
          assert isinstance(x['season_evaluations'],dict)
          assert x['sample_sufficient']==(x['games']>=200)
          assert x['minimum_evaluations_for_research']==200
          if x['games']:
              assert isinstance(x['margin_mae'],(int,float))
          else:
              assert x['margin_mae'] is None and not x['season_evaluations']
          print('NCAA research diagnostics validated:',x['games'],'evaluations')
          PY
      - name: Commit refreshed research audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ncaab_research.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh NCAA research diagnostics schema'
            git pull --rebase
            git push
          fi
