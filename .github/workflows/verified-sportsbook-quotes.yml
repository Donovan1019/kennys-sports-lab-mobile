name: Verified Sportsbook Quote Validation
on:
  pull_request:
    paths:
      - 'scripts/normalize_sportsbook_quotes.py'
      - 'tests/test_normalize_sportsbook_quotes.py'
      - '.github/workflows/publish-market-edges.yml'
      - '.github/workflows/verified-sportsbook-quotes.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_normalize_sportsbook_quotes.py' -v
      - run: python -m compileall -q scripts/normalize_sportsbook_quotes.py
