name: UFC Historical Mirror Schema Probe
on:
  pull_request:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_ufc_mirror_fight_schema_audit.py -v
      - run: python scripts/ufc_mirror_fight_schema_audit.py --output ufc_mirror_schema_report.json
      - uses: actions/upload-artifact@v4
        with:
          name: ufc-mirror-schema-report
          path: ufc_mirror_schema_report.json
