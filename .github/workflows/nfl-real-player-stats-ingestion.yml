name: NFL Real Player Stats Ingestion
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_nfl_player_stats_feed.py'
      - 'scripts/build_nfl_player_stats_feed.py'
      - '.github/workflows/nfl-real-player-stats-ingestion.yml'
  schedule:
    - cron: '30 8 * * *'
    - cron: '20 14,15,20,21 * * *'
  pull_request:
    paths:
      - 'scripts/build_nfl_player_stats_feed.py'
      - 'scripts/audit_nfl_player_stats_feed.py'
      - 'tests/test_build_nfl_player_stats_feed.py'
      - '.github/workflows/nfl-real-player-stats-ingestion.yml'
permissions:
  contents: read
concurrency:
  group: nfl-history-publish
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gate additional refreshes to 10 AM and 4 PM Eastern
        id: eastern
        run: |
          hour_utc=$(date -u +%H)
          hour_et=$(TZ=America/New_York date +%H)
          if [ "${{ github.event_name }}" != 'schedule' ] || [ "$hour_utc" = '08' ] || [ "$hour_et" = '10' ] || [ "$hour_et" = '16' ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - run: python -m unittest discover -s tests -p 'test_build_nfl_player_stats_feed.py' -v
        if: steps.eastern.outputs.run == 'true'
      - name: Download official nflverse stats and schedule
        if: github.event_name != 'pull_request' && steps.eastern.outputs.run == 'true'
        run: |
          for season in 2025 2026; do
            curl --fail --location --retry 2 --max-time 120 "https://github.com/nflverse/nflverse-data/releases/download/stats_player/stats_player_week_${season}.csv" -o "/tmp/nflverse-player-stats-${season}.csv"
          done
          curl --fail --location --retry 2 --max-time 120 'https://github.com/nflverse/nflverse-data/releases/download/schedules/games.csv' -o /tmp/nflverse-games.csv
      - name: Build and audit actual feed
        if: github.event_name != 'pull_request' && steps.eastern.outputs.run == 'true'
        run: |
          python scripts/build_nfl_player_stats_feed.py --input /tmp/nflverse-player-stats-2025.csv --input /tmp/nflverse-player-stats-2026.csv --schedule /tmp/nflverse-games.csv --output /tmp/nfl_player_stats.json
          python scripts/audit_nfl_player_stats_feed.py /tmp/nfl_player_stats.json > /tmp/nfl_player_stats_audit.json
          python -c "import json; r=json.load(open('/tmp/nfl_player_stats_audit.json')); assert r['status']=='SOURCE_PROVENANCE_VERIFIED',r"
          python -c "import json; r=json.load(open('/tmp/nfl_player_stats.json')); assert r.get('independentlyVerified') is True and all(g.get('verified') is True and g.get('game_date') for p in r['players'] for g in p['games']), 'Missing schedule provenance'"
          python -c "import json; a=json.load(open('/tmp/nfl_player_stats_audit.json')); r=json.load(open('/tmp/nfl_player_stats.json')); assert a['game_count']>0 and a['player_count']>0 and a['event_id_coverage']==a['game_count'] and a['duplicate_player_events']==0 and a['missing_values']==0, 'Archive audit failed'; assert sum(len(p['games']) for p in r['players'])==a['game_count'], 'Audit mismatch'"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && steps.eastern.outputs.run == 'true'
        with:
          name: verified-source-nfl-player-stats-candidate
          path: |
            /tmp/nfl_player_stats.json
            /tmp/nfl_player_stats_audit.json
      - name: Publish audited NFL historical archive
        if: github.event_name != 'pull_request' && steps.eastern.outputs.run == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B main origin/main
            mkdir -p feed
            cp /tmp/nfl_player_stats.json feed/nfl_player_stats.json
            cp /tmp/nfl_player_stats_audit.json feed/nfl_player_stats_audit.json
            git add feed/nfl_player_stats.json feed/nfl_player_stats_audit.json
            if git diff --cached --quiet; then
              echo 'Audited NFL player history already up to date'
              exit 0
            fi
            git commit -m 'data: refresh audited NFL player history [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            echo "Concurrent main update; retrying NFL publish ($attempt)"
          done
          echo 'NFL audited publish failed after five attempts' >&2
          exit 1
