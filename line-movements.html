<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Line Movements | Kenny's Sports Lab</title><style>body{margin:0;background:#10151e;color:#e6edf5;font:14px system-ui}main{max-width:760px;margin:auto;padding:14px}a{color:#a9c9ff}button,select{background:#202c3b;color:white;border:1px solid #526174;border-radius:8px;padding:10px}article{background:#192330;border:1px solid #344355;border-radius:10px;padding:12px;margin:8px 0}small{color:#aebdce;display:block;margin:5px 0} .quote{border-top:1px solid #344355;padding:7px 0}h1{font-size:24px}h2{font-size:17px}.row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.up{color:#66d6a1}.down{color:#ffb0a9}</style></head><body><main><a href="index.html">← Home</a><h1>Line Movements</h1><p>Historical market movement vs game outcomes. First and latest observed quotes are not official opening or closing lines.</p><label>Sport <select id="sport"><option value="basketball_nba">NBA</option><option value="americanfootball_nfl">NFL</option><option value="icehockey_nhl">NHL</option><option value="basketball_ncaab">NCAAB</option><option value="basketball_wnba">WNBA</option><option value="mma_mixed_martial_arts">MMA</option></select></label> <label>View <select id="view"><option value="today">Today (ET)</option><option value="upcoming">Upcoming</option><option value="history">Historical</option></select></label><section id="summary" aria-live="polite"></section><section id="rows"></section></main><script>
const sport=document.querySelector('#sport'),view=document.querySelector('#view'),summary=document.querySelector('#summary'),rows=document.querySelector('#rows');let token=0;
function el(tag,text,parent){const n=document.createElement(tag);n.textContent=text;parent.append(n);return n}
const pct=p=>Number.isFinite(p)?(100*p).toFixed(2)+'%':'Unavailable';
const fair=p=>Number.isFinite(p)&&p>0&&p<1?(p>=.5?'-'+Math.round(100*p/(1-p)):'+'+Math.round(100*(1-p)/p)):'Unavailable';
const stamp=t=>Number.isFinite(Date.parse(t))?new Date(t).toLocaleString('en-US',{timeZone:'America/New_York'})+' ET':'Unavailable';
function quote(parent,name,first,last){el('small',name+' no-vig: '+pct(first)+' → '+pct(last),parent)}
async function load(){const id=++token;summary.textContent='Loading verified archive…';rows.replaceChildren();try{const r=await fetch('feed/'+sport.value+'_line_movement.json',{cache:'no-store'});if(!r.ok)throw Error('Feed unavailable');const d=await r.json();if(id!==token)return;if(!Array.isArray(d.event_consensus))throw Error('Updated verified feed not published');summary.replaceChildren();const a=d.outcome_audit||{},b=d.predictive_benchmark||{};el('h2','Historical validation',summary);el('p','Settled games: '+(a.graded_events??0)+' | Directional hit rate: '+(a.hit_rate==null?'Unavailable':(100*a.hit_rate).toFixed(1)+'%'),summary);el('p','Predictive benchmark: '+(b.status||'Unavailable'),summary);if(b.market_brier!=null)el('p','Market Brier: '+b.market_brier.toFixed(4)+' | Movement Brier: '+b.movement_brier.toFixed(4),summary);el('small','Research only • Independent score simulations and core markets shown when supported',summary);const day=t=>new Date(t).toLocaleDateString('en-CA',{timeZone:'America/New_York'});const list=(view.value==='history'?d.event_consensus:(d.current_slate||[])).filter(x=>view.value==='history'?Date.parse(x.event_start)<=Date.now():Date.parse(x.event_start)>Date.now()&&(view.value!=='today'||day(x.event_start)===day(Date.now()))).sort((a,b)=>Date.parse(a.event_start)-Date.parse(b.event_start));if(!list.length)el('p','No verified observations for this view.',rows);for(const x of list){const c=el('article','',rows);el('strong',x.away+' @ '+x.home,c);el('p',new Date(x.event_start).toLocaleString('en-US',{timeZone:'America/New_York'})+' ET',c);el('p',x.median_change_pp==null?'Awaiting second verified quote':'Movement toward '+(x.median_change_pp>0?x.home:x.median_change_pp<0?x.away:'neither team')+' | '+Math.abs(x.median_change_pp).toFixed(2)+' pp',c);el('small',x.bookmakers+' books • Result: '+(x.outcome||'Unsettled'),c);quote(c,x.home,x.first_home_probability,x.latest_home_probability);quote(c,x.away,Number.isFinite(x.first_home_probability)?1-x.first_home_probability:null,Number.isFinite(x.latest_home_probability)?1-x.latest_home_probability:null);const mag=Math.abs(x.median_change_pp);if(Number.isFinite(x.median_change_pp))el('small','Movement magnitude: '+(mag<1?'Minimal':mag<3?'Moderate':mag<=5?'Significant':'Major')+' (research thresholds)',c);for(const q of (d.series||[]).filter(q=>q.event_id===x.event_id)){const z=el('div','',c);z.className='quote';el('strong',q.bookmaker,z);quote(z,x.home,q.first_home_no_vig,q.latest_home_no_vig);quote(z,x.away,Number.isFinite(q.first_home_no_vig)?1-q.first_home_no_vig:null,Number.isFinite(q.latest_home_no_vig)?1-q.latest_home_no_vig:null);el('small','First: '+stamp(q.first_captured_at)+' | Latest: '+stamp(q.latest_captured_at),z);el('small','Raw moneyline prices: unavailable in movement archive',z)}const s=x.score_simulation||{};el('p',s.trials?'Kenny’s simulation: '+(100*s.home_win_probability).toFixed(1)+'% home | '+s.projected_away_score.toFixed(1)+' – '+s.projected_home_score.toFixed(1)+' | '+s.trials+' trials':'Simulation unavailable: '+(s.reason||'No verified inputs'),c);if(s.trials){el('small','Model fair odds: '+x.home+' '+fair(s.home_win_probability)+' | '+x.away+' '+fair(s.away_win_probability),c);el('small','EV unavailable without verified offered odds; simulation research only.',c);if(Number.isFinite(x.median_change_pp)&&x.median_change_pp!==0&&Number.isFinite(s.home_win_probability)&&s.home_win_probability!==.5)el('small','Market direction vs model favorite: '+((x.median_change_pp>0)===(s.home_win_probability>.5)?'Agreement':'Disagreement'),c)}for(const m of (d.core_market_movements||[]).filter(m=>m.event_id===x.event_id))el('small',m.bookmaker+' '+m.market+': '+m.first_point+' → '+m.latest_point+' | '+stamp(m.latest_captured_at),c)}}catch(e){if(id===token)summary.textContent='UNAVAILABLE — '+e.message}}
sport.onchange=view.onchange=load;load();
</script></body></html>
