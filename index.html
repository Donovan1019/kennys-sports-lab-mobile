<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Arial,sans-serif;background:#050a13;color:#eaf3fa}
*{box-sizing:border-box}
body{margin:0;min-width:0}
.ksl-nav{display:flex;gap:8px;padding:12px;background:#10233a;border-bottom:1px solid #42677b;position:sticky;top:0;z-index:100;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.ksl-nav::-webkit-scrollbar{display:none}
.ksl-nav a{flex:0 0 auto;display:inline-block;text-decoration:none;border:1px solid #42677b;border-radius:8px;padding:9px 13px;color:#eaf3ff;font-weight:700}
.ksl-nav a[aria-current="page"]{background:#24755b;border-color:#36c985}
main{max-width:1100px;margin:auto;padding:18px 14px 45px}
button,select{background:#19242a;color:#f0f7f8;border:1px solid #38525a;border-radius:10px;padding:10px;font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid #8deeb1;outline-offset:2px}
#ksl-market-edge,#ksl-pipeline-status{margin-bottom:22px}
@media(max-width:650px){main{padding:12px 10px 36px}.ksl-nav{padding:8px;gap:5px}.ksl-nav a{padding:9px;font-size:13px}}
.kmd-game{padding:12px 14px;margin:10px 0;background:#12223a;border:1px solid #42677b;border-radius:12px}.kmd-game-header{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;padding-bottom:8px;border-bottom:1px solid #38536a}.kmd-game-header span{color:#a9bccc;white-space:nowrap;font-size:12px}.kmd-team{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0}.kmd-team+.kmd-team{border-top:1px solid #2d4359}.kmd-team-info{display:flex;flex-direction:column;gap:3px;min-width:0}.kmd-team-info strong{font-size:14px}.kmd-team-info>span{color:#a9bccc;font-size:12px}.kmd-books{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.kmd-book{display:flex;flex-direction:column;gap:2px;background:#1a3045;border:1px solid #34576c;border-radius:7px;padding:5px 8px;font-size:12px;white-space:nowrap}.kmd-book small{font-size:10px;color:#8deeb1}.kmd-card{display:flex;justify-content:space-between;gap:12px;padding:12px;margin:8px 0;background:#10233a;border:1px solid #42677b;border-radius:10px;flex-wrap:wrap}.kmd-card>div:last-child{text-align:right}.kmd-muted{color:#a9bccc;font-size:12px;margin-top:4px}.kmd-state{display:inline-block;font-size:11px;font-weight:700;color:#8deeb1;margin-bottom:5px}

/* Dense sportsbook comparison: one matchup, two single-line team rows on phones. */
#ksl-model-decisions .kmd-game{padding:9px 11px;margin:7px 0;border-radius:10px}
#ksl-model-decisions .kmd-game-header{font-size:12px;line-height:1.3;gap:6px;padding-bottom:6px}
#ksl-model-decisions .kmd-game-header strong{min-width:0;font-size:12px;line-height:1.3}
#ksl-model-decisions .kmd-game-header span{font-size:10px}
#ksl-model-decisions .kmd-team{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px;align-items:center;padding:6px 0}
#ksl-model-decisions .kmd-team-info{min-width:0;gap:2px}
#ksl-model-decisions .kmd-team-info strong{font-size:12px;line-height:1.2}
#ksl-model-decisions .kmd-team-info>span{font-size:10px;line-height:1.2}
#ksl-model-decisions .kmd-books{display:flex;flex-wrap:nowrap;gap:4px;justify-content:flex-end}
#ksl-model-decisions .kmd-book{padding:4px 5px;min-width:49px;max-width:83px;gap:1px;border-radius:6px;font-size:11px;line-height:1.15}
#ksl-model-decisions .kmd-book small{font-size:9px;line-height:1.15;white-space:normal}
@media(max-width:430px){
#ksl-model-decisions .kmd-game{padding:8px}
#ksl-model-decisions .kmd-game-header{align-items:flex-start}
#ksl-model-decisions .kmd-game-header span{flex:0 0 auto}
#ksl-model-decisions .kmd-team-info strong{font-size:11px}
#ksl-model-decisions .kmd-team-info>span{font-size:9px}
#ksl-model-decisions .kmd-book{min-width:43px;max-width:72px;padding:4px}
#ksl-model-decisions .kmd-book small{font-size:8px}
}
</style>
